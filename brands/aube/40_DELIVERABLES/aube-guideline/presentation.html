<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aube — Guide de marque, la présentation</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0609">
<link rel="icon" href="logo/aube-symbole-aurore.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/aube.css">
<link rel="stylesheet" href="assets/plates.css">
<style>
html,body{height:100%;background:#0A0609;color:#EDE6E1;overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr auto;font-size:15px}
a{color:inherit}
:focus-visible{outline:2px solid var(--miel);outline-offset:3px;border-radius:6px}
.bar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.07)}
.bar .home{display:flex;align-items:flex-end;gap:12px;text-decoration:none}
.bar .home svg{height:24px;width:auto}
.bar .home span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;padding-bottom:1px}
.bar .sp{flex:1}
.bar .ttl{font-size:14px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:9px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:none;color:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.b:hover{background:rgba(255,255,255,.07)}
.b.p{background:var(--aurore);border-color:var(--aurore);color:#fff}
.stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.mp.one{position:relative;flex:none;border-radius:6px;box-shadow:0 40px 90px -40px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.07)}
.mp.one>.in{zoom:var(--k,1)}
.mp.one.in-anim{animation:lever .5s cubic-bezier(.16,1,.3,1)}
@keyframes lever{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mp.one.in-anim{animation:none}}
.arrow{position:absolute;top:0;bottom:0;width:18%;border:0;background:none;color:#fff;cursor:pointer;font-size:26px;opacity:0;transition:opacity .2s;z-index:5}
.arrow:hover,.arrow:focus-visible{opacity:.9}
.arrow.l{left:0;text-align:left;padding-left:22px;background:linear-gradient(90deg,rgba(10,6,9,.5),transparent)}
.arrow.r{right:0;text-align:right;padding-right:22px;background:linear-gradient(270deg,rgba(10,6,9,.5),transparent)}
.foot{display:flex;align-items:center;gap:16px;padding:12px 22px 14px;border-top:1px solid rgba(255,255,255,.07)}
.foot .n{font-family:var(--mono);font-size:12px;letter-spacing:.06em;min-width:70px}
.prog{flex:1;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--braise),var(--aurore),var(--miel));transition:width .5s cubic-bezier(.16,1,.3,1)}
.grid{position:fixed;inset:0;z-index:20;background:rgba(10,6,9,.97);display:none;overflow:auto;padding:26px 26px 60px}
.grid.on{display:block}
.grid h2{font-weight:300;font-size:30px;color:#fff;margin:6px 0 22px;display:flex;justify-content:space-between;align-items:center}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gg button{padding:0;border:1px solid rgba(255,255,255,.1);border-radius:8px;overflow:hidden;background:#150D15;cursor:pointer;color:inherit;text-align:left;font-family:inherit}
.gg button.cur{box-shadow:0 0 0 2px var(--aurore)}
.gg img{display:block;width:100%;height:auto;aspect-ratio:16/9}
.gg span{display:flex;gap:10px;padding:9px 12px 11px;font-size:13px}
.gg span i{font-family:var(--mono);font-style:normal;font-size:10.5px;color:var(--aurore);padding-top:2px}
@media (max-width:760px){.bar .ttl,.bar .home span,.hide-s{display:none}.bar{gap:8px;padding:10px 12px}.b{padding:8px 11px}.arrow{display:none}}
</style>
<script src="assets/aube.js"></script>
<script src="assets/pages.js"></script>
</head>
<body>
<header class="bar">
  <a class="home" href="index.html" id="home" title="Retour au guide de marque"></a>
  <span class="ttl" id="ttl"></span>
  <span class="sp"></span>
  <button class="b" id="bgrid" title="Touche G">Toutes les pages</button>
  <button class="b hide-s" id="bfull" title="Touche F">Plein écran</button>
  <a class="b p" href="deck/aube-guide-de-marque.pdf" download>PDF</a>
</header>
<main class="stage" id="stage">
  <div class="mp one" id="slide"><div class="in" id="in"></div></div>
  <button class="arrow l" id="prev" aria-label="Page précédente">←</button>
  <button class="arrow r" id="next" aria-label="Page suivante">→</button>
</main>
<footer class="foot"><span class="n" id="num"></span><div class="prog"><i id="prog"></i></div><span class="n hide-s" style="text-align:right;opacity:.5;min-width:150px">← → pour naviguer</span></footer>
<div class="grid" id="grid" role="dialog" aria-label="Toutes les pages"><h2>Guide de marque <button class="b" id="gclose">Fermer</button></h2><div class="gg" id="gg"></div></div>
<script>
(function () {
  const P = window.GuidePages, O = window.GuideOrder, T = window.GuideTitles, A = window.Aube;
  const $ = (s) => document.querySelector(s), pad = (n) => String(n).padStart(2, '0');
  $('#home').innerHTML = A.wordmark('#fff') + '<span>Guide de marque</span>';
  let i = 0;
  const fit = () => { const st = $('#stage'); const k = Math.min((st.clientWidth - 40) / 1280, (st.clientHeight - 40) / 720); const s = $('#slide'); s.style.setProperty('--k', k); s.style.width = 1280 * k + 'px'; s.style.height = 720 * k + 'px'; };
  const go = (n, anim = true) => {
    i = Math.max(0, Math.min(O.length - 1, n));
    $('#in').innerHTML = P[O[i]];
    const s = $('#slide'); s.classList.remove('in-anim'); if (anim) { void s.offsetWidth; s.classList.add('in-anim'); }
    $('#num').textContent = pad(i + 1) + ' / ' + pad(O.length); $('#ttl').textContent = T[i];
    $('#prog').style.width = ((i + 1) / O.length) * 100 + '%';
    document.title = T[i] + ' — Aube, guide de marque';
    history.replaceState(null, '', '#' + (i + 1));
    document.querySelectorAll('#gg button').forEach((b, k) => b.classList.toggle('cur', k === i));
  };
  $('#gg').innerHTML = O.map((k, n) => `<button data-n="${n}"><img src="deck/${pad(n + 1)}.jpg" alt="" loading="lazy"><span><i>${pad(n + 1)}</i>${T[n]}</span></button>`).join('');
  const grid = (on) => $('#grid').classList.toggle('on', on);
  document.querySelectorAll('#gg button').forEach((b) => b.addEventListener('click', () => { go(+b.dataset.n); grid(false); }));
  $('#bgrid').addEventListener('click', () => grid(true)); $('#gclose').addEventListener('click', () => grid(false));
  $('#prev').addEventListener('click', () => go(i - 1)); $('#next').addEventListener('click', () => go(i + 1));
  const full = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
  $('#bfull').addEventListener('click', full);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') return grid(false);
    if (e.key === 'g' || e.key === 'G') return grid(!$('#grid').classList.contains('on'));
    if ($('#grid').classList.contains('on')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(i + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(i - 1); }
    if (e.key === 'Home') go(0); if (e.key === 'End') go(O.length - 1);
    if (e.key === 'f' || e.key === 'F') full();
  });
  let x0 = null;
  $('#stage').addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  $('#stage').addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); x0 = null; });
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== i) go(n - 1); });
  fit(); go((parseInt(location.hash.slice(1), 10) || 1) - 1, false);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) { const t0 = performance.now(); const loop = (now) => { if (!document.hidden) A.seekOrbs((now - t0) / 1000, 8, $('#in')); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
