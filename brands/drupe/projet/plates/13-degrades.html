<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css"><script src="../brand/marque.js"></script>
<style>
  .dg-grid{left:396px;top:76px;width:920px;height:660px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
  .dg-grid>div{position:relative}
  .dg-grid .lbl{position:absolute;left:18px;bottom:16px;font-size:11px;text-transform:none}
  .dg-ordre{left:84px;top:470px;width:250px}
  .dg-ordre .pt{display:grid;grid-template-columns:30px 1fr;align-items:center;height:31px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .dg-ordre .pt i{width:18px;height:18px;border-radius:50%}
</style>
<body>
<div class="plate" id="p" style="height:880px;background:var(--fleur)">
  <h1 class="h-xl abs" style="left:84px;top:66px">Dégradés</h1>
  <p class="abs body-l" style="left:84px;top:164px;width:272px;font-size:17px;line-height:1.45">Ils suivent le mûrissement du fruit, de la feuille à la cerise, toujours dans cet ordre et sans autre teinte. La Cerise ne touche jamais la Feuille&nbsp;: entre les deux, il y a toujours du clair. Sur les grandes surfaces, un grain de papier.</p>
  <div class="abs dg-ordre" id="o"></div>
  <div class="abs dg-grid" id="g"></div>
</div>
<script>
const C = Marque.COULEURS;
/* Ordre du mûrissement, du vert au rouge */
document.getElementById('o').innerHTML = `<div class="lbl" style="opacity:.6;margin-bottom:12px">Ordre du mûrissement</div>` +
  [['Feuille', C.feuille], ['Café vert', C.vert], ['Parche', C.parche], ['Pulpe', C.pulpe], ['Cerise', C.cerise]]
    .map(([n, h]) => `<div class="pt"><i style="background:${h};box-shadow:inset 0 0 0 1px rgba(42,26,20,.12)"></i><span>${n}</span></div>`).join('');
/* Neuf préréglages du socle : g1 à g6 clairs (texte Grain ou Feuille), g7 à g9 denses (texte Fleur) */
const enc = (i) => (i <= 5 ? C.grain : i === 6 ? C.feuille : C.fleur);
document.getElementById('g').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((i) => `<div class="g${i} grain"><span class="lbl" style="color:${enc(i)}">.g${i}</span></div>`).join('');
document.getElementById('p').insertAdjacentHTML('beforeend', Marque.foot('Couleurs', 'Dégradés'));
</script>
</body>
