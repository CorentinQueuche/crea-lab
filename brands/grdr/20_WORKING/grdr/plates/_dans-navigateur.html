<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Un écran dans une barre de navigateur, pour l'incrustation</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="../brand/ecrans.css"><link rel="stylesheet" href="../brand/ecrans-b.css"><link rel="stylesheet" href="../brand/ecrans-c.css">
<style>
  /* Le contenu d'un écran d'ordinateur à incruster dans une photo : barre d'adresse sobre (inventée, pas celle d'un vrai navigateur)
     puis l'outil. plates/_dans-navigateur.html?e=ficheProjet&H=876  → 1440 × H px */
  html,body{margin:0;background:#EFE3D6}
  .plate{width:1440px;background:#EFE3D6}
  .nv-bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;font-family:var(--mono);font-size:11.5px;color:rgba(42,30,23,.6)}
  .nv-bar b{width:11px;height:11px;border-radius:50%;background:rgba(42,30,23,.18)}
  .nv-bar span{margin:0 auto;padding:6px 70px;border-radius:9px;background:rgba(42,30,23,.07)}
</style></head>
<body>
<div class="plate" id="p"></div>
<script src="../brand/marque.js"></script><script src="../brand/carte.js"></script><script src="../brand/ecrans.js"></script><script src="../brand/ecrans-b.js"></script><script src="../brand/ecrans-c.js"></script>
<script>
const q = new URLSearchParams(location.search), e = q.get('e') || 'tableauDeBord', H = +(q.get('H') || 876);
document.getElementById('p').style.height = H + 'px';
document.getElementById('p').innerHTML = `<div class="nv-bar"><b></b><b></b><b></b><span>${Marque.DOMAINE}</span></div>` + Marque.app[e]({ h: H - 44 });
Marque.typo();
window.pret = Promise.all([...document.images].map((i) => (i.decode ? i.decode().catch(() => 0) : 0)));
</script>
</body></html>
