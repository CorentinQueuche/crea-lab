<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>03 · L’idée</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="pl.css">
<style>
  /* 03 · L'idée : du symbole à l'empreinte. Un schéma coté, presque technique. Le symbole officiel et l'empreinte d'un
     projet sont dessinés à la même échelle (2,5 px par unité du tracé), sur un quadrillage dont le pas est celui du symbole
     (27,4) : les cercles sont tangents aux lignes, et les lignes de rappel passent d'une figure à l'autre.
     Rien n'est posé à l'œil : tout vient de Marque.CONSTRUCTION et de Marque.empreinteGeo. */
  .plate{height:1300px}
  .pl-quad{position:absolute;left:84px;top:97.5px;width:1233px;height:959px;border:1px solid rgba(42,30,23,.16);
    background-image:linear-gradient(to right,rgba(42,30,23,.065) 1px,transparent 1px),linear-gradient(to bottom,rgba(42,30,23,.065) 1px,transparent 1px);
    background-size:68.5px 68.5px;background-position:-1px -1px}
  .pl-fig{position:absolute}
  .pl-svg text{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;fill:var(--encre)}
  .pl-svg .pl-l{fill:var(--lagune)}
  .pl-svg .pl-g{font-size:13px;font-weight:600;letter-spacing:.02em}
  .pl-dit{position:absolute;left:84px;right:84px;top:1098px;margin:0;font-size:52px;line-height:1.02;max-width:1180px}
</style></head>
<body>
<div class="plate clair grain" id="p"></div>
<script src="../brand/marque.js"></script>
<script>
const M = Marque, C = M.COULEURS, K = M.CONSTRUCTION, H = 1300;
const k = 2.5, PAS = K.pas * k;                         /* 68,5 px : le pas du quadrillage */
const SB = M.LOGO.symbolBox, sx = 119.75, sy = 150;     /* le symbole : 620 × 836 px */
const X = (u) => sx + (u - SB[0]) * k, Y = (v) => sy + (v - SB[1]) * k;
const r1 = (v) => Math.round(v * 10) / 10;
const A = [X(K.gauche.centre[0]), Y(K.gauche.centre[1])], B = [X(K.droite.centre[0]), Y(K.droite.centre[1])];
const a = K.inclinaison * Math.PI / 180, DX = Math.sin(a), DY = Math.cos(a);
const fr = (n) => String(n).replace('.', ',');

/* ---- figure 2 : l'empreinte, à la même échelle, son centre sur la même horizontale, dix pas plus à droite ---- */
const N = 3, G = M.empreinteGeo(N), box = M.empreinteCadre(N), E = [A[0] + 10 * PAS, A[1]];
const ex = E[0] + box[0] * k, ey = E[1] + box[1] * k, eh = box[3] * k;
const pied = (i) => [E[0] + G[i].pied[0] * k, E[1] + G[i].pied[1] * k];

const fin = 'stroke="' + C.encre + '" stroke-width="1" fill="none"';
const croix = (p, c = C.encre) => `<g stroke="${c}" stroke-width="1"><path d="M${p[0] - 9},${p[1]} H${p[0] + 9} M${p[0]},${p[1] - 9} V${p[1] + 9}"/><circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${C.blanc}"/></g>`;
let s = '';

/* lignes de rappel : l'axe des centres, puis le sommet de chaque boucle, d'une figure à l'autre */
s += `<path d="M96,${A[1]} H1304" ${fin} stroke-opacity=".55" stroke-dasharray="14 4 2 4"/>`;
for (let i = 1; i <= 3; i++) s += `<path d="M${A[0]},${A[1] - i * PAS} H${E[0]}" ${fin} stroke-opacity=".5" stroke-dasharray="3 4"/>`;
/* la cote du pas, entre les deux figures */
const xc = 781.5;
s += `<path d="M${xc},${A[1]} V${A[1] - 3 * PAS}" ${fin}/>`;
for (let i = 0; i <= 3; i++) s += `<path d="M${xc - 6},${A[1] - i * PAS + 6} L${xc + 6},${A[1] - i * PAS - 6}" ${fin} stroke-width="1.4"/>`;
for (let i = 0; i < 3; i++) s += `<text class="pl-l" x="${xc + 12}" y="${A[1] - (i + 0.5) * PAS + 4}">${fr(K.pas)}</text>`;
s += `<text x="${xc - 12}" y="${A[1] - 3 * PAS - 14}" text-anchor="middle">Le pas</text>`;

/* figure 1 : les deux familles de cercles, complétées */
K.gauche.rayons.forEach((r) => { s += `<circle cx="${A[0]}" cy="${A[1]}" r="${r1(r * k)}" ${fin} stroke-opacity=".6" stroke-dasharray="5 4"/>`; });
K.droite.rayons.forEach((r) => { s += `<circle cx="${B[0]}" cy="${B[1]}" r="${r1(r * k)}" fill="none" stroke="${C.lagune}" stroke-width="1" stroke-dasharray="5 4"/>`; });
s += croix(A) + croix(B, C.lagune);
s += `<text class="pl-g" x="${A[0] + 10}" y="${A[1] - 9}">A</text><text class="pl-g pl-l" x="${B[0] + 19}" y="${B[1] - 13}">B</text>`;
/* l'inclinaison des jambes : au point de tangence de la grande boucle, la verticale et l'axe de la jambe */
const R3 = K.gauche.rayons[2] * k, T = [A[0] - R3 * DY, A[1] + R3 * DX], La = 330, Ra = 262;
s += `<path d="M${r1(T[0])},${r1(T[1])} V${r1(T[1] + La)}" ${fin} stroke-dasharray="3 4"/>`;
s += `<path d="M${r1(T[0] - 70 * DX)},${r1(T[1] - 70 * DY)} L${r1(T[0] + (La + 14) * DX)},${r1(T[1] + (La + 14) * DY)}" ${fin} stroke-opacity=".75"/>`;
s += `<path d="M${r1(T[0])},${r1(T[1] + Ra)} A${Ra},${Ra} 0 0 0 ${r1(T[0] + Ra * DX)},${r1(T[1] + Ra * DY)}" ${fin}/>`;
s += `<circle cx="${r1(T[0])}" cy="${r1(T[1])}" r="3.5" fill="${C.blanc}" stroke="${C.encre}"/>`;
s += `<text class="pl-l" x="${r1(T[0] + 226 * Math.sin(a / 2) - 14)}" y="${r1(T[1] + 226 * Math.cos(a / 2))}">${fr(K.inclinaison)}°</text>`;

/* figure 2 : les mêmes cercles, le même centre, trois quarts de tour */
G.forEach((g) => { s += `<circle cx="${E[0]}" cy="${E[1]}" r="${r1(g.r * k)}" ${fin} stroke-opacity=".45" stroke-dasharray="5 4"/>`; });
s += croix(E);
const ra = 30, t0 = Math.atan2(DX, -DY), t1 = t0 + 262 * Math.PI / 180, P = (t, r = ra) => [E[0] + r * Math.cos(t), E[1] + r * Math.sin(t)], q0 = P(t0), q1 = P(t1);
s += `<path d="M${r1(q0[0])},${r1(q0[1])} A${ra},${ra} 0 1 1 ${r1(q1[0])},${r1(q1[1])}" ${fin} stroke-width="1.2"/>`;
const fl = (d) => { const t = t1 - Math.PI / 2 + d; return [q1[0] + 9 * Math.cos(t), q1[1] + 9 * Math.sin(t)]; }, fa = fl(0.5), fb = fl(-0.5);
s += `<path d="M${r1(fa[0])},${r1(fa[1])} L${r1(q1[0])},${r1(q1[1])} L${r1(fb[0])},${r1(fb[1])}" ${fin} stroke-width="1.2"/>`;
s += `<text class="pl-g" x="${E[0] + 8}" y="${E[1] - 8}">¾</text>`;
/* l'épaisseur, au sommet de la grande boucle */
const ye = E[1] - G[2].r * k;
s += `<path d="M${E[0] - 18},${ye - 12.5} H${E[0] + 18} M${E[0] - 18},${ye + 12.5} H${E[0] + 18}" ${fin} stroke-width="1.4"/><path d="M${E[0]},${ye - 12.5} V${ye - 40}" ${fin}/>`;
s += `<text class="pl-l" x="${E[0] + 10}" y="${ye - 30}">Ép. ${K.epaisseur}</text>`;
/* les années, au pied de chaque boucle */
['Année 1', 'Année 2', 'Année 3 · en cours'].forEach((t, i) => { const f = pied(i); s += `<text x="${r1(f[0] - 14)}" y="${r1(f[1] + 33)}"${i === 2 ? ' font-weight="600"' : ''}>${t}</text>`; });
const f3 = pied(2);
s += `<path d="M${r1(f3[0] - 22)},${r1(f3[1])} H${r1(f3[0] - 96)}" ${fin}/><circle cx="${r1(f3[0] - 22)}" cy="${r1(f3[1])}" r="2.5" fill="${C.encre}"/>`;
s += `<text x="${r1(f3[0] - 104)}" y="${r1(f3[1] - 3)}" text-anchor="end">Le pied</text><text x="${r1(f3[0] - 104)}" y="${r1(f3[1] + 13)}" text-anchor="end">Le lieu du projet</text>`;

/* titres des figures et lecture */
s += `<text x="100" y="128">Fig. 1 · Le symbole officiel, mesuré</text><text x="${r1(ex)}" y="128">Fig. 2 · L’empreinte d’un projet, même construction</text>`;
s += `<text x="100" y="976"><tspan font-weight="600">A</tspan> · Trois boucles,</text><text x="100" y="993">trois quarts de tour</text>`;
s += `<text class="pl-l" x="100" y="1018"><tspan font-weight="600">B</tspan> · Deux arcs et la jambe</text><text class="pl-l" x="100" y="1035">qui ferme la goutte</text>`;
s += `<text x="1300" y="1018" text-anchor="end">Une boucle, une année</text><text x="1300" y="1035" text-anchor="end">Cotes en unités du tracé officiel</text>`;

document.getElementById('p').innerHTML = M.entete() +
  `<div class="pl-quad"></div>` +
  M.symbol('ocre', `class="pl-fig" style="left:${sx}px;top:${sy}px;width:${SB[2] * k}px;height:${SB[3] * k}px"`) +
  M.empreinte({ cernes: [1, 1, 0.5], actif: 2, attrs: `style="position:absolute;left:${ex}px;top:${ey}px;height:${eh}px;width:auto"` }) +
  `<svg class="pl-svg net" width="1400" height="${H}" viewBox="0 0 1400 ${H}">${s}</svg>` +
  `<p class="pl-dit t-titre net">${M.IDEE.replace(' : ', ' :<br>')}</p>` +
  M.foot('03 · L’idée', 'GRDR · Djongoma');
</script>
</body></html>
