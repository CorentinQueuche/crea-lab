<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>09 · La marge du comptable</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="pl.css">
<style>
  /* 09 · La marge du comptable : un à-plat sable, réglé comme une feuille de suivi (lignes, double filet de marge).
     Les trois signes du métier (code analytique, montant à l'euro, tampon du journal) y sont collés en étiquettes,
     légèrement de travers ; une seule ligne de tableau, agrandie, traverse la planche bien droite, avec ses repères. */
  .plate{height:1130px;background:var(--sable)}
  .pl-regle{position:absolute;inset:0;background-image:linear-gradient(to bottom,rgba(42,30,23,.10) 1px,transparent 1px);background-size:100% 46px;background-position:0 30px}
  .pl-marge{position:absolute;top:0;bottom:0;left:522px;width:6px;border-left:1px solid rgba(232,83,48,.7);border-right:1px solid rgba(232,83,48,.7)}
  .pl-tete{position:absolute;left:84px;top:104px;width:420px}
  .pl-tete h1{margin:18px 0 0;font-size:66px}
  .pl-tete p{margin:26px 0 0;font-family:var(--titre);font-weight:600;font-size:19px;line-height:1.32;letter-spacing:-.012em;max-width:400px;text-wrap:balance}

  /* une étiquette */
  .pl-e{position:absolute;left:var(--x);top:var(--y);padding:13px 18px 16px;border-radius:12px;background:var(--blanc);transform:rotate(var(--r,0deg));
    box-shadow:0 0 0 1px rgba(42,30,23,.06),0 1px 2px rgba(90,45,15,.14),0 16px 22px -14px rgba(90,45,15,.5)}
  .pl-e>.pl-m{display:block;opacity:.66;margin-bottom:var(--mb,9px)}
  .pl-e .montant{display:block;line-height:.92}
  .pl-e .tampon{zoom:1.2}
  .pl-codes{display:flex;flex-wrap:wrap;gap:8px;width:356px;font-size:17px}

  /* la grande ligne */
  .pl-ligne{position:absolute;left:0;right:0;top:494px;height:184px;background:var(--blanc);display:flex;align-items:center;gap:30px;padding:0 84px;
    box-shadow:0 1px 0 rgba(42,30,23,.10),0 -1px 0 rgba(42,30,23,.10),0 30px 40px -30px rgba(90,45,15,.45)}
  .pl-ligne .pl-m{display:block;opacity:.62;margin-bottom:10px}
  .pl-pr{flex:1;min-width:0}
  .pl-pr>div{display:flex;align-items:center;gap:12px;font-size:22px}
  .pl-pr>div .pl-k{opacity:.62;font-size:11.5px}
  .pl-pr b{display:block;margin-top:10px;font-weight:700;font-size:31px;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
  .pl-ex{display:flex;align-items:center;gap:16px}
  .pl-ex b{font-family:var(--titre);font-weight:800;font-size:34px;letter-spacing:-.035em;line-height:1}
  /* les repères, sous la ligne */
  .pl-rep{position:absolute;top:678px;padding:30px 0 0 12px;border-left:1px solid rgba(42,30,23,.55);white-space:normal;width:var(--w,200px);line-height:1.45}
  .pl-rep b{font-weight:600}
  .pl-rep.pl-haut{top:auto;bottom:636px;padding:0 0 30px 12px}
</style></head>
<body>
<div class="plate grain" id="p"></div>
<script src="../brand/marque.js"></script>
<script src="../brand/ecrans.js"></script>
<script>
const M = Marque, C = M.COULEURS, D = M.DONNEES, S = M.app;
const p = D.projets[0], c = M.cernesDe(p);
const etiq = (x, y, r, html, extra = '') => `<div class="pl-e" style="--x:${x}px;--y:${y}px;--r:${r}deg;${extra}">${html}</div>`;
const j = D.journal[1];

document.getElementById('p').innerHTML = `<i class="pl-regle"></i><i class="pl-marge"></i>` + M.entete() +
  `<div class="pl-tete net"><div class="pl-m">09 · La marge du comptable</div><h1 class="t-titre">La marge du comptable.</h1>
     <p>Le code en chasse fixe, le montant à l’euro près, le tampon du journal : qui, quoi, quand.</p></div>` +
  /* en haut : le montant, les codes, le tampon. data-voulu sur la légende du montant : l'étiquette est penchée, le contrôle
     lit des boîtes gonflées et croit la légende sur le chiffre ; à l'œil, 18 px les séparent. */
  etiq(604, 112, -2.2, `<span class="pl-m" style="--mb:18px" data-voulu>Budget total · ${D.synthese.projets} projets signés</span>${M.montant(D.synthese.budget, 'style="font-size:86px"')}`) +
  etiq(566, 322, 1.6, `<span class="pl-m">Codes analytiques</span><div class="pl-codes">${D.projets.map((q, i) => M.code(q.code, q.alerte ? 'vermillon' : ['lagune', 'ocre', 'lagune', 'emeraude'][i % 4])).join('')}</div>`) +
  etiq(962, 368, -3, `<span class="pl-m">Journal</span>${M.tampon(`Extrait de Sage · ${D.extraction.court}`)}<br><span style="display:block;height:8px"></span>${M.tampon('0 ressaisie')}`) +
  /* la grande ligne : un projet, tel qu'il se lit dans le tableau */
  `<div class="pl-ligne net">${M.empreinte({ cernes: c.cernes, actif: c.actif, cadre: 5, taille: 132 })}
     <div class="pl-pr"><div>${M.code(p.code, 'vermillon')}<span class="pl-k">${D.pays[p.pays]} · ${S.mmaa(p.debut)} → ${S.mmaa(p.fin)}</span></div><b>${p.titre}</b></div>
     <div><span class="pl-m">Budget total</span>${M.montant(p.total, 'style="font-size:62px;line-height:.9;display:block"')}</div>
     <div><span class="pl-m">Exécuté</span><div class="pl-ex">${M.jauge({ v: p.taux, repere: S.ecoule(p), w: 236, ep: 14, c: 'vermillon' })}<b>${M.pct(p.taux)}</b></div></div></div>` +
  `<div class="pl-rep pl-haut pl-m net" style="left:100px;--w:260px"><b>L’empreinte</b><br>une boucle par année</div>
   <div class="pl-rep pl-m net" id="r2" style="left:218px;--w:270px"><b>Le code analytique</b><br>en chasse fixe, toujours le même</div>
   <div class="pl-rep pl-m net" id="r3" style="left:700px;--w:290px"><b>Le montant</b><br>à l’euro près, jamais arrondi<br>dans un tableau</div>
   <div class="pl-rep pl-m net" id="r4" style="left:1020px;--w:300px"><b>Le trait et son repère</b><br>l’exécuté, face au prorata attendu</div>` +
  /* en bas : la section, le reste, deux tampons */
  etiq(84, 812, 1.8, `<span class="pl-m">Section analytique</span>${M.code('ECOS-MR-22', 'lagune').replace('class="code"', 'class="code" style="font-size:46px"')}`) +
  etiq(452, 946, -2.6, `<span class="pl-m">Journal · ${j.h}</span>${M.tampon(`${j.quoi} · ${j.qui}`, 'ocre')}`) +
  etiq(640, 792, 1.2, `<span class="pl-m" style="--mb:14px">Reste à exécuter · ${p.code}</span>${M.montant(p.total - p.execute, `style="font-size:58px;color:${C.lagune}"`)}`) +
  etiq(968, 900, -1.6, `<span class="pl-m">À surveiller</span>${M.tampon(S.ALERTES[0].t, 'vermillon')}`) +
  M.foot('09 · La marge du comptable', 'GRDR · Djongoma');

/* chaque repère part du bord gauche de ce qu'il désigne */
const P = document.getElementById('p').getBoundingClientRect(), L = document.querySelector('.pl-ligne').children;
[['r2', L[1]], ['r3', L[2]], ['r4', L[3]]].forEach(([id, el]) => { document.getElementById(id).style.left = Math.round(el.getBoundingClientRect().left - P.left) + 'px'; });
</script>
</body></html>
