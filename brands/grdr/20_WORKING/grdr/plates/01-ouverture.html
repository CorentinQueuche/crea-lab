<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>01 · Ouverture</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="../brand/ecrans.css"><link rel="stylesheet" href="sc.css">
<style>
  /* 01 · Ouverture : le tableau de bord, seul, plein cadre, sans un mot. Le lavis déborde du bord gauche,
     le symbole passe en filigrane derrière la fenêtre. Variante : ?v=incline (la fenêtre vue de trois quarts). */
  .plate{width:1400px;height:1050px}
  .ou-lavis{position:absolute;left:-12%;top:-18%;width:76%;height:86%;-webkit-mask-image:radial-gradient(closest-side,#000 52%,transparent 100%);mask-image:radial-gradient(closest-side,#000 52%,transparent 100%);opacity:.95}
  .ou-lavis2{position:absolute;right:-22%;bottom:-34%;width:70%;height:80%;-webkit-mask-image:radial-gradient(closest-side,#000 40%,transparent 100%);mask-image:radial-gradient(closest-side,#000 40%,transparent 100%);opacity:.8}
</style></head>
<body>
<div class="plate sc grain" id="p"></div>
<script src="../brand/marque.js"></script><script src="../brand/carte.js"></script><script src="../brand/ecrans.js"></script>
<script>
const M = Marque, v = new URLSearchParams(location.search).get('v') || 'face';
let h = `<img class="ou-lavis" src="${M.aqURL('aube')}" alt=""><img class="ou-lavis2" src="${M.aqURL('terre')}" alt="">`;
if (v === 'face') {
  h += M.filigrane({ c: 'blanc', op: 0.75, style: 'right:-150px;top:-190px;width:760px;height:1024px' });
  h += `<div class="sc-fen net" style="--z:.84;left:95px;top:96px;width:1210px;height:1010px"><div>${M.app.tableauDeBord()}</div></div>`;
} else {
  h += M.filigrane({ c: 'blanc', op: 0.7, style: 'left:-170px;bottom:-330px;width:760px;height:1024px' });
  h += `<div class="net" style="position:absolute;inset:0;perspective:2600px;perspective-origin:50% 30%">
    <div class="sc-plan" style="left:250px;top:-40px;width:1440px;transform:rotateX(48deg) rotateZ(-30deg) scale(1.02)">
      <div class="sc-ombre" style="left:60px;top:120px;width:1440px;height:1400px;transform:translateZ(-90px);opacity:.55"></div>
      <div class="sc-fen" style="position:relative;--z:1;width:1440px;height:1500px"><div>${M.app.tableauDeBord()}</div></div>
    </div></div>`;
}
document.getElementById('p').innerHTML = h;
window.pret = Promise.all([...document.images].map((i) => (i.decode ? i.decode().catch(() => 0) : 0)));
</script>
</body></html>
