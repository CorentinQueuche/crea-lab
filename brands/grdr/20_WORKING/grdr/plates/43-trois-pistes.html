<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>43 · Trois pistes, une retenue</title>
<link rel="stylesheet" href="../brand/marque.css">
<style>
  /* 43 · Le chemin : les trois directions étudiées, montrées comme trois esquisses côte à côte.
     Deux sont barrées d'un trait (écartées, avec la raison), la troisième est gardée et passe en couleur. */
  .plate{width:1400px;height:1000px;background:var(--papier)}
  .tp-t{position:absolute;left:84px;top:116px;font-family:var(--titre);font-weight:900;font-size:76px;letter-spacing:-.05em;line-height:.92}
  .tp-t em{font-style:normal;color:var(--vermillon)}
  .tp-g{position:absolute;left:84px;right:84px;top:330px;display:grid;grid-template-columns:1fr 1fr 1.18fr;gap:28px}
  .tp-c{position:relative}
  .tp-v{position:relative;height:400px;border-radius:26px;overflow:hidden;background:var(--blanc);border:1px solid var(--filet)}
  .tp-c.non .tp-v{filter:grayscale(1) contrast(.92);opacity:.78}
  .tp-c.non .tp-v::after{content:"";position:absolute;left:-10%;top:50%;width:120%;height:2.5px;background:var(--encre);transform:rotate(-22deg)}
  .tp-c.oui .tp-v{background:var(--nuit);border:0;box-shadow:0 40px 60px -34px rgba(18,49,47,.7)}
  .tp-n{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px}
  .tp-n b{font-family:var(--titre);font-weight:800;font-size:24px;letter-spacing:-.03em}
  .tp-n span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;opacity:.6}
  .tp-c.oui .tp-n span{opacity:1;color:var(--vermillon)}
  .tp-c p{margin:0;font-size:14.5px;line-height:1.45;max-width:330px;opacity:.8}
  .tp-gr{position:absolute;inset:26px;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:34px;gap:5px}
  .tp-gr i{border:1.3px solid rgba(42,30,23,.5);border-radius:3px;font-style:normal;font-family:var(--mono);font-size:9.5px;display:grid;place-items:center end;padding-right:6px;color:rgba(42,30,23,.7)}
</style></head>
<body>
<div class="plate grain" id="p"></div>
<script src="../brand/marque.js"></script><script src="../brand/carte.js"></script>
<script>
const M = Marque, C = M.COULEURS, R = M.rnd(5);
let cells = ''; for (let i = 0; i < 45; i++) cells += `<i>${i === 17 ? '#REF!' : (R() > 0.45 ? M.nombre(Math.round(R() * 800000 + 3000)) : '')}</i>`;
document.getElementById('p').innerHTML = M.entete() +
  `<div class="tp-t net">Trois pistes,<br><em>une retenue.</em></div>
   <div class="tp-g net">
     <div class="tp-c non"><div class="tp-v"><div class="tp-gr">${cells}</div></div><div class="tp-n"><b>Le tableur apprivoisé</b><span>Écartée</span></div><p>Des grilles et des cellules, mises au propre. Juste pour un outil qui remplace un fichier Excel, mais froid : rien n’y dit le GRDR.</p></div>
     <div class="tp-c non"><div class="tp-v" style="background:${C.papier}">${M.carte({ cadre: [-100, 380, 760, 800], terres: 'sable', cPays: 'peche', filet: 'papier', villes: ['Nouakchott', 'Dakar', 'Bamako', 'Conakry'], rVille: 9, attrs: 'style="position:absolute;inset:0;width:100%;height:100%"' })}</div><div class="tp-n"><b>La carte d’abord</b><span>Écartée</span></div><p>Ici et là-bas en héros. Belle, mais un budget n’est pas d’abord une carte. Elle reste dans le kit.</p></div>
     <div class="tp-c oui"><div class="tp-v grain nuit">${M.empreinte({ cernes: [1, 1, 1, 0.72, 0.3], c: 'menthe', piste: 'rgba(255,251,246,.12)', actif: 3, cActif: 'miel', attrs: 'style="position:absolute;left:50%;top:44px;height:330px;width:auto;transform:translateX(-50%)"' })}</div><div class="tp-n"><b>L’empreinte</b><span>Retenue</span></div><p>Le symbole du GRDR est déjà un graphique : des boucles autour d’un lieu. Une boucle par année, tracée jusqu’à l’exécuté.</p></div>
   </div>` + M.foot('43 · Trois pistes, une retenue', 'GRDR · Djongoma');
window.pret = Promise.all([...document.images].map((i) => (i.decode ? i.decode().catch(() => 0) : 0)));
</script>
</body></html>
