<!doctype html><meta charset="utf-8"><title>32 · Du tableur à l’outil</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="../brand/ecrans.css"><link rel="stylesheet" href="motion.css">
<script src="../brand/marque.js"></script><script src="../brand/carte.js"></script><script src="../brand/ecrans.js"></script>
<script src="lib.js"></script><script src="scenes.js"></script>
<style>
  /* ----- Avant : un tableur générique, gris, dessiné en code (aucune interface de logiciel réel) ----- */
  .mv32-feuille{position:absolute;inset:0;z-index:61;background:#F1F0EE;color:#55514D;overflow:hidden}
  .mv32-barre{position:absolute;left:0;right:0;top:0;height:64px;background:#E9E7E4;border-bottom:1px solid #CFCCC8;display:flex;align-items:center;font-family:var(--mono);font-size:20px;color:#55514D}
  .mv32-barre>b{width:120px;margin-left:96px;height:38px;line-height:36px;text-align:center;background:#FBFBFA;border:1px solid #CFCCC8;font-weight:500}
  .mv32-barre>i{margin:0 20px 0 26px;font-family:var(--font);font-style:italic;font-weight:600;color:#8D8883}
  .mv32-barre>span{flex:1;height:38px;line-height:36px;padding:0 16px;margin-right:96px;background:#FBFBFA;border:1px solid #CFCCC8;white-space:pre}
  .mv32-lettres{position:absolute;left:0;right:0;top:64px;height:44px;background:#E3E1DD;border-bottom:1px solid #CFCCC8}
  .mv32-lettres>i,.mv32-num{position:absolute;font-style:normal;font-family:var(--mono);font-size:15px;font-weight:500;color:#8D8883;text-align:center}
  .mv32-lettres>i{top:0;height:44px;line-height:44px;border-left:1px solid #CFCCC8}
  .mv32-num{left:0;width:72px;height:52px;line-height:52px;background:#E3E1DD;border-bottom:1px solid #CFCCC8}
  .mv32-corps{position:absolute;left:72px;right:0;top:108px;bottom:0;background:#FBFBFA repeating-linear-gradient(to bottom,transparent 0 51px,#D9D6D2 51px 52px)}
  .mv32-v{position:absolute;top:108px;bottom:0;width:1px;background:#D9D6D2}
  .mv32-c{position:absolute;height:52px;line-height:51px;padding:0 16px;font-family:var(--font);font-weight:400;font-size:21px;color:#55514D;white-space:nowrap;overflow:hidden}
  .mv32-c.mv32-d{text-align:right;font-family:var(--titre);font-weight:500;font-variant-numeric:tabular-nums lining-nums}
  .mv32-c.mv32-m{font-family:var(--mono);font-size:19px}
  .mv32-c.mv32-t{font-weight:700;color:#6F6A65}
  .mv32-c.mv32-n{font-style:italic;color:#8D8883}
  .mv32-c.mv32-err{background:#FBDDD3;color:#B5321A;text-align:right;font-family:var(--titre);font-weight:700;box-shadow:inset 0 0 0 1px #F1B7A6}
  .mv32-sel{position:absolute;z-index:64;box-shadow:inset 0 0 0 3px #3F3B38;pointer-events:none}
  .mv32-sel::after{content:"";position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;background:#3F3B38;box-shadow:0 0 0 2px #FBFBFA}
  /* ----- Le passage : les lignes du tableur, détachées de la grille ----- */
  .mv32-fant{position:absolute;inset:0;z-index:62;pointer-events:none}
  .mv32-b{position:absolute;background:#FBFBFA}
  .mv32-b>i{position:absolute;top:0;bottom:0;width:1px;background:#D9D6D2}
  .mv32-b>u{position:absolute;top:0;bottom:0;background:#FBDDD3;box-shadow:inset 0 0 0 1px #F1B7A6}
  .mv32-x{position:absolute;white-space:nowrap;line-height:normal;font-variant-numeric:tabular-nums lining-nums}
  /* ----- Après : la carte « Projets » de l'outil, la phrase, le logo ----- */
  .mv32-outil.dj{position:absolute;display:block;width:742px;min-height:0;background:transparent;transform-origin:0 0}
  .mv32-g{position:absolute;left:128px;top:0;width:600px;height:1080px}
  .mv32-phrase{position:absolute;left:0;top:402px;font-size:66px;line-height:1.02;color:var(--encre)}
  .mv32-phrase>div{white-space:nowrap}
  .mv32-phrase .mv32-vif{color:var(--vermillon);margin-top:.22em}
  .mv32-etq{position:absolute;left:2px;top:356px}
  .mv32-pied{position:absolute;left:0;bottom:96px;display:flex;align-items:center;gap:26px}
  .mv32-pied>svg{height:92px;width:auto}
  .mv32-pied>hr{width:1px;height:56px;border:0;margin:0;background:var(--filet)}
  .mv32-prod{display:flex;align-items:center;gap:13px}
  .mv32-prod .icone-app{border-radius:13px}
  .mv32-prod b{display:block;font-family:var(--titre);font-weight:800;font-size:22px;letter-spacing:-.025em;line-height:1.1}
  .mv32-prod span{display:block;font-size:15px;color:rgba(42,30,23,.62);line-height:1.2;margin-top:2px}
</style>
<body><div class="m-stage mv-scene grain" id="s"></div>
<script>
/* 32 · Du tableur à l'outil. Avant : un tableur générique (grille grise, A B C, une cellule en « #REF! », sa formule cassée).
   Puis la grille se referme sur la carte « Projets » de l'outil : six lignes s'en détachent, se resserrent, s'arrondissent,
   et leurs montants vont se ranger, les mêmes, dans le tableau de l'outil ; l'erreur laisse la place au montant calculé ;
   les empreintes se tracent, les jauges avancent. Phrase : « Le fichier Excel prend sa retraite. Sa rigueur reste. » 9 s.
   node tools/record.mjs motion/32-du-tableur-a-l-outil.html out/motion/32-du-tableur-a-l-outil.mp4 --dur 9 --apercu */
const A = Marque, app = A.app, D = A.DONNEES, C = A.COULEURS, s = document.getElementById('s');
const N = 6, PROJ = D.projets, ERR = 2;                 /* six lignes passent dans l'outil ; la ligne OICC porte l'erreur */
const GRIS = '#55514D', ROUGE = '#B5321A';
/* la feuille : colonnes (bords gauches), lignes de 52 px sous la barre de formule et les lettres */
const X = [72, 232, 792, 1052, 1262, 1522, 1752, 2000], Y0 = 108, RH = 52, PAD = 16, yL = (r) => Y0 + (r - 1) * RH;
const cel = (r, c, txt, cls = '') => `<span class="mv32-c ${cls}" style="left:${X[c]}px;top:${yL(r)}px;width:${X[c + 1] - X[c]}px">${txt}</span>`;
const ligneFeuille = (p, r) => cel(r, 0, p.code, 'mv32-m') + cel(r, 1, p.titre) + cel(r, 2, A.nombre(p.total), 'mv32-d') + cel(r, 3, A.pct(p.taux), 'mv32-d') + cel(r, 4, A.nombre(p.total - p.execute), 'mv32-d');
const FORMULE = '=C4-Feuil2!#REF!';

s.innerHTML =
  `<div class="mv32-g m-net">
     <div class="mv-leg mv-doux mv32-etq" id="etq">Du tableur à l’outil</div>
     <div class="mv-phrase mv32-phrase"><div id="ph1">Le fichier Excel</div><div id="ph2">prend sa retraite.</div><div id="ph3" class="mv32-vif">Sa rigueur reste.</div></div>
     <div class="mv32-pied" id="pied">${A.lockup()}<hr><div class="mv32-prod">${A.icone(48)}<div><b>${A.PRODUIT}</b><span>${A.PRODUIT_DESC}</span></div></div></div>
   </div>
   <div class="dj mv32-outil m-net" id="outil">${app.blocProjets({ n: N, p: 1 })}</div>
   <div class="mv32-feuille" id="feuille">
     <div class="mv32-corps"></div>
     ${X.slice(1, 7).map((x) => `<i class="mv32-v" style="left:${x}px"></i>`).join('')}
     <div class="mv32-barre"><b id="ref">C2</b><i>fx</i><span><span id="f1">${PROJ[0].total}</span><span id="f2">${FORMULE}</span></span></div>
     <div class="mv32-lettres">${'ABCDEFG'.split('').map((l, c) => `<i style="left:${X[c]}px;width:${X[c + 1] - X[c]}px">${l}</i>`).join('')}</div>
     ${Array.from({ length: 19 }, (_, k) => `<i class="mv32-num" style="top:${yL(k + 1)}px">${k + 1}</i>`).join('')}
     ${cel(1, 0, 'Code', 'mv32-t') + cel(1, 1, 'Projet', 'mv32-t') + cel(1, 2, 'Budget total', 'mv32-t mv32-d') + cel(1, 3, 'Exécuté', 'mv32-t mv32-d') + cel(1, 4, 'Reste', 'mv32-t mv32-d') + cel(1, 5, 'Commentaire', 'mv32-t')}
     ${PROJ.slice(N).map((p, k) => ligneFeuille(p, N + 2 + k)).join('')}
     ${cel(12, 1, 'TOTAL', 'mv32-t') + cel(12, 2, '=SOMME(C2:C10', 'mv32-m') + cel(12, 4, '#REF!', 'mv32-err') + cel(12, 5, 'ne pas modifier', 'mv32-n')}
   </div>
   <div class="mv32-fant" id="fant"></div>
   <div class="mv32-sel" id="sel"></div>`;
A.typo(s);
const $ = (id) => document.getElementById(id);
const outil = $('outil'), feuille = $('feuille'), fant = $('fant'), sel = $('sel'), carte = outil.querySelector('.dj-c');
const trs = [...outil.querySelectorAll('tbody tr')];
const ecrire = [M.typer($('ph1')), M.typer($('ph2')), M.typer($('ph3'))], ecrireF = M.typer($('f2'), { soft: 1, rise: 0 });

/* mélange de deux couleurs proches (gris → encre, gris → lagune) */
const rvb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mixC = (a, b, p) => { const x = rvb(a), y = rvb(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * p)).join(',')})`; };
const hex = (c) => { const m = c.match(/\d+/g).map(Number); return '#' + m.slice(0, 3).map((v) => v.toString(16).padStart(2, '0')).join(''); };
const boiteTexte = (n) => { const r = document.createRange(); r.selectNodeContents(n); return r.getBoundingClientRect(); };

let Z = 1.38, fantomes = [], CR = null, mesure = false;
/* Tout ce qui dépend des polices se mesure une fois : la place de la carte, puis, pour chaque ligne, d'où part chaque
   texte (sa cellule dans la feuille) et où il arrive (le même texte dans la ligne de l'outil). */
function mesurer() {
  const h = carte.offsetHeight * Z, l = 742 * Z;
  M.css(outil, { left: (1920 - 128 - l) + 'px', top: ((1080 - h) / 2).toFixed(1) + 'px', transform: `scale(${Z})` });
  { const r = carte.getBoundingClientRect(); CR = { x: r.left, y: r.top, w: r.width, h: r.height }; }
  fant.innerHTML = '';
  fantomes = PROJ.slice(0, N).map((p, i) => { const tr = trs[i], r = i + 2, R = tr.getBoundingClientRect();
    const bande = M.el(`<div class="mv32-b">${X.slice(1, 7).map((x) => `<i data-x="${x - X[0]}"></i>`).join('')}${i === ERR ? `<u data-x="${X[4] - X[0]}" data-l="${X[5] - X[4]}"></u>` : ''}</div>`);
    fant.appendChild(bande);
    const cibles = { code: tr.querySelector('.code'), titre: tr.querySelector('.dj-proj>div>b'), total: tr.querySelectorAll('td.d .dj-num')[0], pct: tr.querySelector('.dj-ex b'), reste: tr.querySelectorAll('td.d .dj-num')[1] };
    const defs = [
      ['code', p.code, 'l', X[0] + PAD, 'var(--mono)', 19, 400],
      ['titre', p.titre, 'l', X[1] + PAD, 'var(--font)', 21, 400],
      ['total', A.nombre(p.total), 'r', X[3] - PAD, 'var(--titre)', 21, 500],
      ['pct', A.pct(p.taux), 'r', X[4] - PAD, 'var(--titre)', 21, 500],
      ['reste', i === ERR ? '#REF!' : A.nombre(p.total - p.execute), 'r', X[5] - PAD, 'var(--titre)', 21, i === ERR ? 700 : 500],
    ];
    const textes = defs.map(([k, txt, anc, x0, fam, s0, w0]) => { const cible = cibles[k], cs = getComputedStyle(cible), el = M.el(`<span class="mv32-x"></span>`);
      el.textContent = txt; el.style.fontFamily = fam; fant.appendChild(el);
      const erreur = k === 'reste' && i === ERR;
      const a = { s: s0, w: w0, ls: 0, c: erreur ? ROUGE : GRIS }, b = { s: parseFloat(cs.fontSize) * Z, w: +cs.fontWeight, ls: (parseFloat(cs.letterSpacing) || 0) / parseFloat(cs.fontSize), c: erreur ? ROUGE : hex(cs.color) };
      /* départ : centré dans la ligne de la feuille */
      M.css(el, { fontSize: a.s + 'px', fontWeight: a.w, letterSpacing: '0em', left: '0px', top: '0px' });
      a.x = x0; a.y = yL(r) + (RH - 1 - el.offsetHeight) / 2;
      /* arrivée : exactement sur le texte de l'outil (on mesure l'écart entre la boîte et les glyphes) */
      M.css(el, { fontSize: b.s + 'px', fontWeight: b.w, letterSpacing: b.ls + 'em' });
      const g = boiteTexte(el), t = boiteTexte(cible.firstChild);
      b.x = anc === 'l' ? t.left - g.left : t.right + (el.offsetWidth - g.right);
      b.y = t.top - g.top;
      return { el, anc, a, b, erreur }; });
    return { i, tr, bande, textes, de: { x: X[0], y: yL(r), w: 1920 - X[0], h: RH }, vers: { x: R.left, y: R.top + 5, w: R.width, h: R.height - 10 }, cibles }; });
  mesure = true;
}

const majLignes = trs.map((tr, i) => MV.bloc(tr, (p) => app.ligneProjet(PROJ[i], { p })));
const T0 = 2.7, DUR = 1.3, DEC = 0.06;                  /* le passage : début, durée, décalage entre deux lignes */
const cellule = (c, r) => ({ x: X[c], y: yL(r), w: X[c + 1] - X[c], h: RH });

window.seek = (t) => {
  if (!mesure) return;
  /* ---------- 1. Avant : la sélection va à la cellule en erreur, la barre montre la formule cassée ---------- */
  const ps = M.tw(t, 0.45, 0.6, M.expoInOut), c1 = cellule(2, 2), c2 = cellule(4, ERR + 2);
  M.css(sel, { left: M.mix(c1.x, c2.x, ps) + 'px', top: M.mix(c1.y, c2.y, ps) + 'px', width: (M.mix(c1.w, c2.w, ps) + 1) + 'px', height: (c1.h) + 'px', opacity: 1 - M.tw(t, T0 - 0.15, 0.3, M.cubicOut) });
  const arrive = ps >= 0.5;
  $('ref').textContent = arrive ? `E${ERR + 2}` : 'C2';
  $('f1').style.display = arrive ? 'none' : ''; $('f2').style.display = arrive ? '' : 'none';
  ecrireF(MV.lin(t, 0.95, 0.5));

  /* ---------- 2. Le passage : la grille se referme sur la carte, les lignes vont se ranger ---------- */
  const mf = M.tw(t, T0, DUR, M.quintInOut);
  feuille.style.clipPath = `inset(${(CR.y * mf).toFixed(2)}px ${((1920 - CR.x - CR.w) * mf).toFixed(2)}px ${((1080 - CR.y - CR.h) * mf).toFixed(2)}px ${(CR.x * mf).toFixed(2)}px round ${(22 * Z * mf).toFixed(2)}px)`;
  feuille.style.opacity = (1 - M.tw(t, T0 + 0.5, 0.6, M.cubicInOut)).toFixed(3);
  feuille.style.visibility = t >= T0 + 1.1 ? 'hidden' : 'visible';
  carte.style.opacity = M.tw(t, T0 + 0.45, 0.6, M.cubicOut).toFixed(3);

  /* la ligne du bas part la première (elle a le plus de chemin) : aucune bande n'en recouvre une autre */
  fantomes.forEach((f) => { const d = T0 + (N - 1 - f.i) * DEC, m = M.tw(t, d, DUR, M.quintInOut), fin = d + DUR - 0.2, vu = M.tw(t, fin, 0.3, M.cubicOut);
    /* la bande : elle se resserre, s'arrondit, puis se fond dans la carte */
    const b = { x: M.mix(f.de.x, f.vers.x, m), y: M.mix(f.de.y, f.vers.y, m), w: M.mix(f.de.w, f.vers.w, m), h: M.mix(f.de.h, f.vers.h, m) };
    const voile = 1 - M.tw(t, d + DUR * 0.55, DUR * 0.4, M.cubicInOut), filets = 1 - M.clamp(m / 0.3);
    M.css(f.bande, { left: b.x.toFixed(2) + 'px', top: b.y.toFixed(2) + 'px', width: b.w.toFixed(2) + 'px', height: b.h.toFixed(2) + 'px', borderRadius: (16 * m).toFixed(2) + 'px',
      backgroundColor: `rgba(251,251,250,${voile.toFixed(3)})`, boxShadow: `inset 0 0 0 1px rgba(217,214,210,${(voile * M.clamp(m * 6)).toFixed(3)}), 0 ${(1 - m) * 0}px 0 rgba(217,214,210,${(1 - M.clamp(m * 6)).toFixed(3)})`,
      borderBottom: m < 0.16 ? '1px solid #D9D6D2' : '0', visibility: voile <= 0 ? 'hidden' : 'visible', overflow: 'hidden' });
    [...f.bande.children].forEach((e) => { const k = b.w / f.de.w; e.style.left = (+e.dataset.x * k).toFixed(2) + 'px'; if (e.dataset.l) e.style.width = (+e.dataset.l * k).toFixed(2) + 'px'; e.style.opacity = filets.toFixed(3); });

    /* la ligne de l'outil : elle paraît sous les textes arrivés, puis son empreinte se trace et sa jauge avance */
    majLignes[f.i](MV.lin(t, fin + 0.25, 1.3));
    f.cibles.pct = f.tr.querySelector('.dj-ex b'); f.cibles.pct.textContent = A.pct(PROJ[f.i].taux);
    f.tr.style.opacity = vu.toFixed(3);

    /* les textes : de la cellule du tableur à leur place dans l'outil ; même montant, autre tenue */
    f.textes.forEach((x) => { const a = x.a, c = x.b, px = M.mix(a.x, c.x, m);
      M.css(x.el, { fontSize: M.mix(a.s, c.s, m).toFixed(2) + 'px', fontWeight: Math.round(M.mix(a.w, c.w, m)), letterSpacing: M.mix(a.ls, c.ls, m).toFixed(4) + 'em', color: mixC(a.c, c.c, m), top: M.mix(a.y, c.y, m).toFixed(2) + 'px' });
      if (x.anc === 'l') { x.el.style.left = px.toFixed(2) + 'px'; x.el.style.right = 'auto'; } else { x.el.style.right = (1920 - px).toFixed(2) + 'px'; x.el.style.left = 'auto'; }
      if (!x.erreur) x.el.style.visibility = vu >= 1 ? 'hidden' : 'visible'; });

    /* l'erreur laisse la place au montant calculé : « #REF! » sort par le haut, le montant monte à sa place */
    if (f.i === ERR) { const q = M.tw(t, fin + 0.35, 0.7, M.expoOut), x = f.textes.find((y) => y.erreur), reel = f.tr.querySelectorAll('td.d .dj-num')[1];
      M.css(x.el, { transform: `translateY(${(-q * 100).toFixed(2)}%)`, clipPath: `inset(${(q * 100).toFixed(2)}% 0 0 0)`, visibility: q >= 1 ? 'hidden' : 'visible' });
      M.css(reel, { display: 'inline-block', transform: `translateY(${((1 - q) * 100).toFixed(2)}%)`, clipPath: `inset(0 0 ${((1 - q) * 100).toFixed(2)}% 0)` }); } });

  /* ---------- 3. Après : la phrase, puis le logo ---------- */
  $('etq').style.opacity = (0.6 * M.tw(t, 5.0, 0.6)).toFixed(3);
  ecrire[0](M.tw(t, 5.1, 0.55, M.cubicOut)); ecrire[1](M.tw(t, 5.5, 0.6, M.cubicOut)); ecrire[2](M.tw(t, 6.2, 0.6, M.cubicOut));
  MV.entree($('pied'), M.tw(t, 6.7, 0.7), 18);
};
window.pret = MV.pret(s).then(() => { mesurer(); seek(0); });
</script></body>
