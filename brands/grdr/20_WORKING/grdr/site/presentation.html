<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRDR · Djongoma, le guide de marque en pages</title>
<meta name="description" content="Le guide de marque de Djongoma, l’outil de gestion budgétaire du GRDR, page par page.">
<meta name="robots" content="noindex">
<link rel="icon" id="favicon" type="image/svg+xml">
<link rel="stylesheet" href="assets/marque.css">
<link rel="stylesheet" href="assets/ecrans.css">
<link rel="stylesheet" href="assets/ecrans-b.css">
<link rel="stylesheet" href="assets/ecrans-c.css">
<link rel="stylesheet" href="assets/pages.css">
<link rel="stylesheet" href="assets/guide.css">
<!-- VISIONNEUSE DES PAGES DU GUIDE : GRDR · Djongoma (site/presentation.html).
     Les pages vivantes de deck/pages.js (copié en assets/pages.js par build_site.py), mises à l'échelle dans la fenêtre.
     CONTRAT (tools/check_deck.mjs) : #num (compteur « 01 / 22 »), #ttl (titre de la page), #in (.mp-in, la page),
     #grid (grille de toutes les pages, ouverte par la touche G), #gg (ses vignettes, des <button>), lien direct #<numéro>,
     flèches, Début, Fin. Vignettes : deck/NN.jpg (deck_pdf.py) ; PDF : deck/<slug>-guide-de-marque.pdf.
     window.GuideMedia AVANT pages.js : les images citées par les pages sont dans guide-media/ sur le site.
     Feuilles et scripts du socle : les mêmes, dans le même ordre, que deck/render.html. -->
<script>window.MarquePhotos = new URL('photos/', document.baseURI).href; window.GuideMedia = 'guide-media/';</script>
<script src="assets/marque.js"></script>
<script src="assets/carte.js"></script>
<script src="assets/ecrans.js"></script>
<script src="assets/ecrans-b.js"></script>
<script src="assets/ecrans-c.js"></script>
<script src="assets/pages.js"></script>
</head>
<body class="gd-vz">
<a class="gd-evite" href="#scene">Aller à la page</a>
<header class="gd-vz-barre">
  <a class="gd-vz-accueil" href="index.html" id="accueil" aria-label="Retour au guide en ligne"></a>
  <span class="gd-vz-titre" id="ttl" aria-live="polite"></span>
  <button class="gd-bt gd-creux gd-petit" id="bgrille" type="button" aria-controls="grid" aria-expanded="false" title="Touche G">Toutes les pages</button>
  <a class="gd-bt gd-petit" id="bpdf" download>PDF</a>
</header>
<main class="gd-vz-scene" id="scene" tabindex="-1" aria-label="Page du guide">
  <div class="gd-vz-une" id="page"><div class="mp-in" id="in"></div></div>
  <button class="gd-vz-fleche gd-vz-g" id="prec" type="button" aria-label="Page précédente"></button>
  <button class="gd-vz-fleche gd-vz-d" id="suiv" type="button" aria-label="Page suivante"></button>
</main>
<footer class="gd-vz-pied"><span class="gd-vz-n" id="num"></span><div class="gd-vz-prog"><i id="prog"></i></div><span class="gd-vz-mention">Proposition KLYRA, non validée par le GRDR. Données de démonstration.</span></footer>
<div class="gd-vz-grille" id="grid" role="dialog" aria-modal="true" aria-label="Toutes les pages">
  <div class="gd-vz-grille-tete"><h2>Toutes les pages</h2><button class="gd-bt gd-creux gd-petit" id="gfermer" type="button">Fermer</button></div>
  <div class="gd-vz-gg" id="gg"></div>
</div>
<script>
(function () {
  const A = window.Marque, C = A.COULEURS, P = window.GuidePages, O = window.GuideOrder || [], T = window.GuideTitles || [];
  const $ = (s) => document.querySelector(s), pad = (n) => String(n).padStart(2, '0');
  $('#accueil').innerHTML = A.lockup(null, 'aria-hidden="true"');
  $('#bpdf').href = 'deck/' + A.SLUG + '-guide-de-marque.pdf';
  $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${C.vermillon}"/>${A.empreinte({ cernes: [1, 1, 1], c: 'blanc', piste: null, attrs: 'x="15" y="9" width="34" height="46"' })}</svg>`);
  $('#prec').innerHTML = A.fleche('currentColor', '', 180); $('#suiv').innerHTML = A.fleche('currentColor');
  if (!P || !O.length) { $('#ttl').textContent = 'Les pages du guide ne sont pas encore écrites (deck/pages.js).'; $('#num').textContent = '00 / 00'; return; }
  const titre = (n) => T[n] || String(O[n]);
  /* Une page : le HTML de GuidePages, puis le crochet GuideApres(racine) */
  const rendre = (k) => { const el = $('#in'); el.innerHTML = P[k]; if (typeof window.GuideApres === 'function') window.GuideApres(el); };
  let i = 0;
  const fit = () => { const sc = $('#scene'), k = Math.max(0.1, Math.min((sc.clientWidth - 24) / 1280, (sc.clientHeight - 24) / 720));
    $('#in').style.setProperty('--mp-k', k); $('#page').style.width = 1280 * k + 'px'; $('#page').style.height = 720 * k + 'px'; };
  const go = (n) => {
    i = Math.max(0, Math.min(O.length - 1, n));
    rendre(O[i]);
    $('#num').textContent = pad(i + 1) + ' / ' + pad(O.length); $('#ttl').textContent = titre(i);
    $('#prog').style.width = ((i + 1) / O.length) * 100 + '%';
    document.title = titre(i) + ' · ' + A.NOM + ' · ' + A.PRODUIT + ', guide de marque';
    history.replaceState(null, '', '#' + (i + 1));
    document.querySelectorAll('#gg button').forEach((b, k) => b.setAttribute('aria-current', String(k === i)));
  };
  $('#gg').innerHTML = O.map((k, n) => `<button type="button" data-n="${n}"><img src="deck/${pad(n + 1)}.jpg" alt="" loading="lazy"><span><i>${pad(n + 1)}</i>${titre(n)}</span></button>`).join('');
  /* Vignette absente (PDF pas encore rendu) : on garde le titre, sans image cassée */
  document.querySelectorAll('#gg img').forEach((im) => im.addEventListener('error', () => im.remove(), { once: true }));
  const grilleOuverte = () => $('#grid').classList.contains('gd-ouvert');
  const grille = (on) => { $('#grid').classList.toggle('gd-ouvert', on); $('#bgrille').setAttribute('aria-expanded', String(on));
    if (on) { const b = document.querySelectorAll('#gg button')[i]; if (b) b.focus(); } else $('#bgrille').focus(); };
  document.querySelectorAll('#gg button').forEach((b) => b.addEventListener('click', () => { go(+b.dataset.n); grille(false); }));
  $('#bgrille').addEventListener('click', () => grille(true)); $('#gfermer').addEventListener('click', () => grille(false));
  $('#prec').addEventListener('click', () => go(i - 1)); $('#suiv').addEventListener('click', () => go(i + 1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && grilleOuverte()) return grille(false);
    if (e.key === 'g' || e.key === 'G') return grille(!grilleOuverte());
    if (grilleOuverte()) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(i + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(i - 1); }
    if (e.key === 'Home') go(0);
    if (e.key === 'End') go(O.length - 1);
  });
  let x0 = null;
  $('#scene').addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  $('#scene').addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); x0 = null; });
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== i) go(n - 1); });
  fit(); go((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
