<!doctype html><meta charset="utf-8"><title>Custom — visuels des scènes 26 (portable) et 32 (téléphone)</title>
<link rel="stylesheet" href="../brand/marque.css"><script src="../brand/marque.js"></script>
<link rel="stylesheet" href="3d2-art.css">
<style>
  /* Fond d'atelier de la scène 26 : mur noir de 3,2 × 1,8 m, 1 px = 1 mm. Texture discrète, ton sur ton. */
  #fond{width:3200px;height:1800px;background:#111113;color:#fff}
  /* Griffes tissées cousues sur les sangles : 44 × 18 mm, 8 px = 1 mm */
  .a2-griffe{width:352px;height:144px;border-radius:6px}
</style>
<body>
<div id="fond" class="a2-v"></div>
<div id="griffe" class="a2-v a2-griffe a2-fluo a2-c"></div>
<div id="griffe-noire" class="a2-v a2-griffe a2-noir a2-c"></div>
<script>
if (location.search.indexOf('t') > -1) document.documentElement.classList.add('a2-t');
const A = Marque, C = A.COULEURS, $ = (id) => document.getElementById(id);

/* ---------- Fond d'atelier : blocs et coulure en graphite sur noir, le Cran au trait, repères, cotes ---------- */
$('fond').innerHTML = `
  <div class="a2-abs" style="left:0;top:0;width:1700px;height:1800px;-webkit-mask-image:linear-gradient(90deg,#000 35%,transparent);mask-image:linear-gradient(90deg,#000 35%,transparent)">${A.motif({ w: 1700, h: 1800, c: '#222226', l: 190, seed: 4, trou: 0.3, attrs: 'style="width:100%;height:100%"' })}</div>
  <div class="a2-abs" style="left:1400px;top:120px;width:2000px;height:1500px">${A.coulure({ w: 2000, h: 1500, c: '#232327', seed: 21, pas: 9, cx: 0.62, cy: 0.5, rx: 0.5, ry: 0.5, frange: 0.2, attrs: 'style="width:100%;height:100%"' })}</div>
  <div class="a2-abs" style="left:980px;top:420px">${A.symbol('#3A3A41', 'style="width:1240px"', { contour: 0.6 })}</div>
  ${[[400, 300], [1600, 300], [2800, 300], [400, 1500], [1600, 1500], [2800, 1500]].map(([x, y]) => `<i class="croix" style="--t:70px;left:${x - 35}px;top:${y - 35}px;color:#fff;opacity:.18"></i>`).join('')}
  <div class="a2-abs a2-mono" style="left:120px;top:110px;font-size:20px;color:rgba(255,255,255,.22)">Custom.fr — le site · CST · WEB · 2025</div>
  <div class="a2-abs a2-mono" style="right:120px;bottom:100px;font-size:20px;color:rgba(255,255,255,.22)">1440 × 900</div>`;

/* ---------- Griffes tissées (fluo : scènes 26 et 32 ; noire : variante) ---------- */
$('griffe').innerHTML = A.logo(C.encre, 'style="height:46px"');
$('griffe-noire').innerHTML = A.logo(C.fluo, 'style="height:46px"');
</script></body>
