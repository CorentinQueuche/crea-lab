<!doctype html><meta charset="utf-8"><title>Custom — 43 · Réseaux sociaux</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates-c.css"><script src="../brand/marque.js"></script><script src="../brand/techniques.js"></script>
<style>
  /* Idée : le fil d'un compte comme une feuille d'atelier. Six carrés, deux formats verticaux, une seule couleur d'atelier (le violet). */
  .p43-q{position:absolute;width:280px;height:280px;overflow:hidden;border-radius:6px}
  .p43-s{position:absolute;width:323px;height:574px;overflow:hidden;border-radius:16px}
  .p43-bar{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:4px;z-index:70}
  .p43-bar i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
  .p43-bar i.on{background:#fff}
  .p43-who{position:absolute;left:12px;top:24px;display:flex;align-items:center;gap:8px;z-index:70;font-size:12px;font-weight:600}
  .p43-rd{border-radius:50%;display:grid;place-items:center;flex:none}
  .p43-hl{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;opacity:.9}
  .p43-hl .p43-rd{box-shadow:0 0 0 2px var(--noir),0 0 0 3.5px rgba(255,255,255,.3)}
</style>
<body><div class="plate" id="p" style="height:1530px"></div>
<script>
const A = Marque, C = A.COULEURS, NB = A.NB, Q = A.DONNEES.citation;
const S = 280, G = 14, X0 = 84, Y0 = 246;
const pos = (i) => [X0 + (i % 3) * (S + G), Y0 + Math.floor(i / 3) * (S + G)];
const rond = (t, fond, c) => `<div class="p43-rd" style="width:${t}px;height:${t}px;background:${fond}">${A.symbol(c, `style="width:${Math.round(t * .58)}px;height:auto"`)}</div>`;
const chrome = (n, on) => `<div class="p43-bar">${Array.from({ length: n }, (_, k) => `<i class="${k <= on ? 'on' : ''}"></i>`).join('')}</div><div class="p43-who">${rond(26, C.fluo, C.encre)}<span>custom.fr</span></div>`;
const posts = [
  // 1 · photo traitée : le trail en duo violet
  `<div class="p43-q" style="color:#fff">${A.photo('trail', { mode: 'duo', c: 'violet', pos: '68% 50%', style: 'position:absolute;inset:0' })}
     <div class="pc-abs" style="left:18px;top:18px;z-index:5">${A.logo('#fff', 'style="height:17px"', { sym: C.fluo })}</div>
     <div class="pc-abs t-large" style="left:18px;bottom:20px;font-size:34px;z-index:5">Porté<br>partout.</div></div>`,
  // 2 · chiffre en blocs
  `<div class="p43-q" style="background:${C.fluo};color:${C.encre}">
     <div class="pc-abs pc-lbl" style="left:20px;top:20px">En quelques chiffres</div>
     <div class="pc-abs" style="left:20px;top:96px">${A.pix('+500', { attrs: 'style="height:70px"' })}</div>
     <div class="pc-abs" style="left:20px;bottom:20px;right:20px"><div style="font-weight:700;font-size:19px;letter-spacing:-.02em">Projets réalisés</div><div class="t-petit" style="opacity:.7">depuis notre création</div></div></div>`,
  // 3 · sprite sur coulure violette
  `<div class="p43-q" style="background:${C.noir}">
     <div class="pc-abs" style="inset:0">${A.coulure({ w: 280, h: 280, c: 'violet', seed: 14, cx: .55, cy: .56, rx: .44, ry: .36, pas: 3, attrs: 'style="width:100%;height:100%"' })}</div>
     <div class="pc-abs" style="left:58px;top:58px;color:${C.fluo}">${A.sprite('moto', 3, { attrs: 'style="height:150px;width:auto"' })}</div>
     <div class="pc-abs pc-lbl" style="left:18px;top:18px;color:#fff">Imaginé chez vous.</div></div>`,
  // 4 · une technique en macro : la broderie
  `<div class="p43-q"><canvas class="pc-cv" data-tech="broderie" data-forme="cran" data-c="#E2FF21" data-fond="molleton" data-zoom="1.08" data-marge=".12" width="560" height="560"></canvas>
     <div class="pc-abs" style="left:16px;bottom:16px;display:flex;gap:8px;align-items:center"><span class="pastille on" style="height:26px">BRO</span><span class="pc-lbl" style="color:#fff">Broderie</span></div></div>`,
  // 5 · la citation du fondateur, mot pour mot
  `<div class="p43-q" style="background:#fff;color:${C.encre}">
     <div class="pc-abs t-titre" style="left:16px;top:6px;font-size:76px;line-height:1;color:${C.violet}">«</div>
     <div class="pc-abs" style="left:20px;right:20px;top:66px;font-size:14.2px;line-height:1.38;font-weight:500;letter-spacing:-.01em">${Q.texte}${NB}»</div>
     <div class="pc-abs" style="left:20px;bottom:18px;right:20px;display:flex;justify-content:space-between;align-items:flex-end"><div><div style="font-weight:700;font-size:13px">${Q.auteur}</div><div class="pc-lbl" style="opacity:.6">${Q.role}</div></div>${A.symbol(C.encre, 'style="height:16px"')}</div></div>`,
  // 6 · l'annonce : devis sous 24 h
  `<div class="p43-q" style="background:${C.noir};color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)">
     <div class="pc-abs" style="left:20px;top:22px;color:${C.fluo}">${A.pix('24h', { attrs: 'style="height:78px"' })}</div>
     <div class="pc-abs" style="left:20px;top:122px;font-weight:700;font-size:21px;letter-spacing:-.02em">Devis sous 24${NB}h</div>
     <div class="pc-abs t-petit" style="left:20px;top:150px;opacity:.65">Un devis détaillé, gratuit<br>et sans engagement.</div>
     <div class="pc-abs" style="left:20px;right:20px;bottom:20px"><span class="bouton" style="width:100%;height:40px;font-size:13.5px">Demander mon devis gratuit</span></div></div>` ];
// format vertical A : la photo d'atelier, la phrase de la marque
const storyA = `<div class="p43-s" style="left:976px;top:${Y0}px;color:#fff">
  ${A.photo('serigraphie', { mode: 'sombre', pos: '58% 50%', style: 'position:absolute;inset:0' })}
  ${chrome(3, 0)}
  <div class="pc-abs t-large" style="left:20px;bottom:150px;font-size:46px;z-index:5">Tout<br>est fait<br>${A.surl('ici.')}</div>
  <div class="pc-abs" style="left:20px;bottom:88px;z-index:5;display:flex;gap:6px">${['SER', 'DTF', 'BRO', 'FLO', 'SUB'].map((c, k) => `<span class="pc-code${k === 0 ? ' on' : ''}" style="height:24px;min-width:0;font-size:10px">${c}</span>`).join('')}</div>
  <div class="pc-abs" style="left:20px;right:20px;bottom:22px;z-index:5;height:44px;border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);display:flex;align-items:center;padding:0 16px;font-size:13px;opacity:.85">Envoyer un message</div></div>`;
// format vertical B : le triptyque sur les marches du Cran
const m = A.marches(3);
const storyB = `<div class="p43-s" style="left:84px;top:${Y0 + 2 * S + G + 32}px;background:${C.fluo};color:${C.encre}">
  <div class="p43-bar">${[0, 1, 2].map((k) => `<i style="background:${k <= 1 ? C.encre : 'rgba(3,1,14,.25)'}"></i>`).join('')}</div>
  <div class="p43-who" style="color:${C.encre}">${rond(26, C.encre, C.fluo)}<span>custom.fr</span></div>
  <div class="pc-abs" style="left:-10px;right:-60px;top:200px">${A.motif({ w: 400, h: 330, c: 'encre', l: 40, seed: 4, trou: .5, attrs: 'style="width:100%;height:330px;opacity:.1"' })}</div>
  <div class="pc-abs" style="left:22px;top:84px;font-weight:700;font-size:24px;line-height:1.12;letter-spacing:-.025em">Imaginé chez vous.<br>Fabriqué chez nous.<br>${A.surl('Porté partout.', 'noir droit')}</div>
  <svg class="pc-abs" viewBox="${m.box.join(' ')}" style="left:22px;top:212px;width:236px;height:auto"><path d="${m.d}" fill="${C.encre}"/></svg>
  <div class="pc-abs" style="left:22px;right:22px;bottom:22px"><div class="t-titre" style="font-size:40px;margin-bottom:12px">Prêt à donner vie à ${A.surl('votre projet ?', 'noir')}</div>
    <span class="bouton noir" style="width:100%;height:44px;font-size:13.5px">custom.fr</span></div></div>`;
const legende = [['01', 'Photo traitée', 'Le trail en duo violet, le logo en blanc et fluo.'], ['02', 'Chiffre en blocs', '+500 projets, dans l’écriture du « 24 h » du site.'], ['03', 'Sprite', 'La moto en blocs, prise dans une coulure violette.'], ['04', 'Technique en macro', 'Le Cran brodé sur molleton, rendu par le moteur des techniques.'], ['05', 'Citation', 'Les mots du fondateur, tels qu’ils sont publiés.'], ['06', 'Annonce', 'Devis sous 24 h : le bouton du site, tel quel.'], ['07', 'Vertical · atelier', 'La raclette en plein cadre, cinq codes de technique.'], ['08', 'Vertical · triptyque', 'Les trois phrases montent les marches du Cran.']];
const univ = [['textile', 'Textile'], ['print', 'Print'], ['goodies', 'Goodies'], ['signaletique', 'Signalétique']];
const yB = Y0 + 2 * S + G + 32;
document.getElementById('p').innerHTML =
  A.entete() +
  `<div class="pc-abs pc-z" style="left:84px;top:100px"><div class="pc-lbl doux" style="margin-bottom:16px">43 · Réseaux sociaux</div><div class="t-titre h-84">Le fil de ${A.surl('l’atelier', 'violet')}</div></div>` +
  `<div class="pc-abs pc-z t-petit" style="left:976px;top:150px;width:323px;opacity:.7">Six publications carrées et deux formats verticaux. Interface générique, aucun réseau nommé.</div>` +
  posts.map((h, i) => { const [x, y] = pos(i); return h.replace('class="p43-q"', `class="p43-q" style="left:${x}px;top:${y}px"`).replace(/class="p43-q" style="left:(\d+)px;top:(\d+)px" style="/, 'class="p43-q" style="left:$1px;top:$2px;'); }).join('') +
  storyA + storyB +
  // en-tête de profil générique, avec les quatre univers en « à la une »
  `<div class="pc-abs pc-z" style="left:443px;top:${yB}px;width:873px">
     <div style="display:flex;gap:22px;align-items:center">${rond(92, C.fluo, C.encre)}<div><div style="font-weight:700;font-size:22px;letter-spacing:-.02em">custom.fr</div><div class="t-txt" style="opacity:.75;margin-top:2px">Atelier de personnalisation. Textile, print, goodies, signalétique. Tout est fait ici.</div></div></div>
     <div style="display:flex;gap:26px;margin-top:26px">${univ.map(([k, n]) => `<div class="p43-hl"><div class="p43-rd" style="width:66px;height:66px;background:${C.graphite};color:${C.fluo}">${A.picto(k, { attrs: 'style="height:30px"' })}</div>${n}</div>`).join('')}
       <div class="p43-hl"><div class="p43-rd" style="width:66px;height:66px;background:${C.violet}">${A.symbol('#fff', 'style="width:34px;height:auto"')}</div>L’atelier</div></div>
     <div class="pc-filet" style="margin:30px 0 20px"></div>
     <div style="display:grid;grid-template-columns:1fr 1fr;column-gap:40px;row-gap:16px">${legende.map(([n, t, d]) => `<div class="pc-leg"><span>${n}</span><b>${t}</b><p>${d}</p></div>`).join('')}</div></div>` +
  A.foot('43 · Réseaux sociaux', 'Custom · direction artistique');
MarqueTech.tous();
</script></body>
