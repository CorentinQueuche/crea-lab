<!doctype html><meta charset="utf-8"><title>Custom — 11 · Typographie</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css"><script src="../brand/marque.js"></script>
<style>
  /* 11 · Typographie et surligneur. Préfixe q11- */
  .q11-row{position:absolute;left:0;right:0;border-top:1px solid var(--filet)}
  .q11-info{position:absolute;left:84px;top:18px;width:236px;z-index:60}
  .q11-info .q11-n{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:10px 0 8px}
  .q11-info .q11-r{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;line-height:1.6;opacity:.58}
  .q11-info .q11-alpha{margin-top:14px;font-size:17px;line-height:1.3;opacity:.9}
  .q11-spec{position:absolute;left:356px;white-space:nowrap;z-index:20}
  .q11-corps{position:absolute;right:84px;top:16px;z-index:60;opacity:.5}
  .q11-bas{position:absolute;left:84px;right:84px;top:1236px;height:606px;display:grid;grid-template-columns:580px 1fr;gap:16px}
  .q11-bas .pl-tuile{padding:22px 26px}
  .q11-cinq{display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;align-items:center;margin-top:26px;padding:22px 18px;border-radius:18px;background:var(--noir)}
  .q11-reg .pl-ligne{grid-template-columns:28px 1fr;font-size:14px;line-height:1.4;padding:9px 0 10px}
  .q11-reg .pl-ligne span:first-child{font-family:var(--mono);font-size:10.5px;opacity:.5}
  .q11-h{position:relative;display:flex;flex-direction:column-reverse;gap:7px}
  .q11-h>.q11-c{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;line-height:1.5;color:var(--fluo);opacity:.8;display:flex;gap:10px;align-items:center}.q11-h>.q11-c::after{content:"";flex:1;height:1px;background:var(--filet)}
</style>
<body><div class="plate grain leger" id="p" style="height:1916px"></div>
<script>
const A = Marque, C = A.COULEURS, NB = A.NB;
const row = (top, h, info, spec, corps) => `<div class="q11-row" style="top:${top}px;height:${h}px">${info}<div class="q11-corps pl-lbl">${corps}</div>${spec}</div>`;
const info = (role, nom, regl, alpha, style) => `<div class="q11-info"><div class="pl-lbl doux">${role}</div><div class="q11-n">${nom}</div><div class="q11-r">${regl}</div><div class="q11-alpha" style="${style}">${alpha}</div></div>`;

/* Surligneur coté : la ligne de base et l'angle de −1,6°, mesurés sur le rendu */
const surlCote = `<div id="q11-sc" style="position:relative;margin-top:26px;height:170px">
  <div class="t-titre h-84" style="position:absolute;left:0;top:0">Chaque objet,<br>sa ${A.surl('technique')}</div></div>`;
const cinq = [['objet', ''], ['atelier', 'violet'], ['chiffres', 'orange monte'], [`24${NB}h`, 'blanc droit'], [`100${NB}%`, 'noir']];

const H = [
  ['Repère · JetBrains Mono 10,5 · capitales · approche +7 %', `<div class="t-mono">Textile · Broderie · BRO · 2026</div>`],
  ['Large · Archivo 125 % · 800 · 64', `<div class="t-large" style="font-size:64px;color:${C.fluo}">Transformez</div>`],
  ['Titre · Bebas Neue 56 · un mot surligné', `<div class="t-titre h-56">On fait plus ${A.surl('qu’un maillot')}</div>`],
  ['Chapeau · Inter 500 · 22 · interligne 1,32', `<p class="t-chapo" style="margin:0">Textile, print, goodies, signalétique : quatre univers sous un même toit.</p>`],
  ['Texte · Inter 400 · 15 · interligne 1,45', `<p class="t-txt t-doux" style="margin:0">Sérigraphie, DTF, broderie, flocage, sublimation : cinq techniques, toutes opérées dans notre atelier. Un devis détaillé en moins de 24${NB}h, sans engagement.</p>`],
  ['Bouton · Inter 600 · 15 · hauteur 48', `<div><span class="bouton">Demander mon devis gratuit</span></div>`]];

document.getElementById('p').innerHTML =
  A.entete() +
  `<div class="pl-intro"><div class="pl-lbl doux">11 · La marque · typographie</div>
    <div class="t-titre h-84">Quatre polices, ${A.surl('une voix')}</div>
    <p class="pl-chapo" style="max-width:560px">La grotesque étirée pour les grands titres, Bebas Neue pour les sections, Inter pour lire, la chasse fixe pour les repères. Les polices de 2025, sans en ajouter une.</p></div>` +
  row(330, 300, info('01 · Large', 'Archivo étirée', 'Largeur 125 % · graisse 800<br>Bas de casse · 1 à 5 mots<br>Interligne 0,9 · approche −3,5 %', 'abcdefghij<br>klmnopqrst<br>uvwxyz 0123', 'font-family:var(--large);font-stretch:125%;font-weight:800;letter-spacing:-.02em'),
    `<div class="q11-spec t-large" style="top:14px;font-size:300px;color:${C.fluo}">Transformez</div>`, 'Corps 300') +
  row(630, 300, info('02 · Titre', 'Bebas Neue', 'Capitales · interligne 0,88<br>Toujours un mot surligné', 'ABCDEFGHIJKLM<br>NOPQRSTUVWXYZ<br>0123456789', 'font-family:var(--titre);font-size:24px;line-height:1.05'),
    `<div class="q11-spec t-titre" style="top:46px;font-size:250px">${A.surl('On fait plus')} qu’un maillot</div>`, 'Corps 250') +
  row(930, 150, info('03 · Texte', 'Inter', 'Graisses 400, 500, 600<br>Texte courant, interface', '', ''),
    `<div class="q11-spec" style="top:22px;font-size:104px;font-weight:600;letter-spacing:-.04em;line-height:1">Chaque objet, sa technique</div>`, 'Corps 104 · 600') +
  row(1080, 120, info('04 · Repère', 'JetBrains Mono', 'Capitales · approche +7 %<br>Cotes, codes, métadonnées', '', ''),
    `<div class="q11-spec t-mono" style="top:30px;font-size:48px;letter-spacing:.07em;opacity:.85">CST · SER · DTF · BRO · FLO · SUB · 0123456789</div>`, 'Corps 48') +
  `<div class="q11-bas">
    <div class="pl-tuile"><div class="pl-lbl doux">Le surligneur · un mot pris dans un bloc de couleur</div>
      ${surlCote}
      <div class="q11-cinq">${cinq.map(([t, c]) => `<div class="t-titre h-36">${A.surl(t, c)}</div>`).join('')}</div>
      <div class="q11-reg" style="margin-top:20px">
        <div class="pl-ligne"><span>01</span><span>Un seul par titre, sur une seule ligne.</span></div>
        <div class="pl-ligne"><span>02</span><span>Tourné de −1,6°. En variation : +1,4°, ou droit pour les chiffres.</span></div>
        <div class="pl-ligne"><span>03</span><span>Fluo par défaut ; violet, orange, blanc ou noir en variation.</span></div>
        <div class="pl-ligne"><span>04</span><span>À l’écran, il se pose de gauche à droite en 0,25 s, puis le texte passe en Encre.</span></div></div></div>
    <div class="pl-tuile noir"><div class="pl-lbl doux" style="margin-bottom:22px">La hiérarchie, montée sur un vrai texte de Custom</div>
      ${H.map(([c, h], i) => `<div class="q11-h" style="margin-top:${i ? 18 : 0}px">${h}<div class="q11-c">${c}</div></div>`).join('')}</div>
  </div>` +
  A.foot('11 · Typographie', 'Custom · direction artistique');
/* Cote de l'angle du surligneur, posée sur sa boîte réelle */
document.fonts.ready.then(() => { const box = document.getElementById('q11-sc'), sl = box.querySelector('.surl'), rb = box.getBoundingClientRect(), r = sl.getBoundingClientRect();
  const x0 = r.left - rb.left, y0 = r.bottom - rb.top + 6, L = r.width + 40, t = Math.tan(1.6 * Math.PI / 180);
  box.insertAdjacentHTML('beforeend', `<svg style="position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible" fill="none" stroke="#fff" stroke-width="1">
    <path d="M${x0},${y0}H${x0 + L}" stroke-dasharray="3 3" opacity=".5"/><path d="M${x0},${y0}L${x0 + L},${y0 - L * t}" opacity=".9"/>
    <path d="M${x0 + L - 22},${y0}V${y0 - (L - 22) * t - 0.5}" stroke="${C.fluo}" stroke-width="1.4"/></svg>
    <span class="pl-cote" style="position:absolute;left:${x0 + L + 8}px;top:${y0 - L * t - 8}px;color:${C.fluo}">−1,6°</span>`); });
</script></body>
