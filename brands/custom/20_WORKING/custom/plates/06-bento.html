<!doctype html><meta charset="utf-8"><title>Custom · 06 · Bento de marque</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css"><script src="../brand/marque.js"></script>
<style>
  /* 06 · Bento de marque. Préfixe q06-. Dix tuiles à grand rayon, tailles inégales, sur une grille de 6 × 6. */
  .q06-g{position:absolute;left:84px;right:84px;top:342px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,160px);gap:14px}
  .q06-g>.pl-tuile{grid-column:var(--c);grid-row:var(--r)}
  .q06-bas{position:absolute;left:22px;right:22px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;z-index:60}
  .q06-c{position:absolute;inset:0;display:grid;place-items:center;z-index:5}
  .pl-tuile.q06-sur-photo .pl-tag,.pl-tuile.q06-sur-photo .q06-bas{color:#fff}
</style>
<body><div class="plate grain leger" id="p" style="height:1460px"></div>
<script>
const A = Marque, C = A.COULEURS, NB = A.NB;
const tuile = (c, r, cls, html) => `<div class="pl-tuile ${cls}" style="--c:${c};--r:${r}">${html}</div>`;
const bas = (a, b = '') => `<div class="q06-bas"><span class="pl-lbl">${a}</span><span class="pl-lbl pl-doux">${b}</span></div>`;
const tiles = [
  /* A · le logo de référence, en grand */
  tuile('1 / span 3', '1 / span 2', 'q06-a', `<span class="pl-tag pl-doux">Logo de référence</span>
    <div class="q06-c">${A.logo('#fff', 'style="width:440px"', { sym: C.fluo })}</div>${bas('Le Cran + Custom.fr', '1 ligne')}`),
  /* B · le fluo plein */
  tuile('4 / span 1', '1 / span 2', 'fluo', `<div style="position:absolute;left:22px;top:22px">${A.symbol(C.encre, 'style="height:30px"')}</div>
    <div style="position:absolute;left:22px;right:22px;bottom:20px"><div class="t-titre h-84">Fluo</div><div class="pl-cote" style="margin-top:8px">#E2FF21</div><div class="pl-lbl" style="margin-top:4px;opacity:.7">La couleur de Custom</div></div>`),
  /* C · la photo traitée : peloton, noir et fluo */
  tuile('5 / span 2', '1 / span 2', '', `${A.photo('peloton', { mode: 'duo', style: 'position:absolute;inset:0' })}
    <span class="pl-tag pastille on" style="left:18px;top:16px;height:26px">Photo · duo fluo</span>`),
  /* D · « 24 h » en blocs, sur blanc */
  tuile('1 / span 2', '3 / span 2', 'blanc', `<span class="pl-tag pl-doux">Chiffres en blocs</span>
    <div style="position:absolute;left:24px;top:70px;color:${C.encre}">${A.pix('24h', { attrs: 'style="height:150px"' })}</div>
    <div style="position:absolute;left:24px;bottom:22px"><b style="font-weight:600;font-size:17px">Devis sous 24${NB}h</b><div class="pl-txt pl-doux" style="margin-top:2px">Un devis détaillé, sans engagement.</div></div>`),
  /* E · le sprite, sur la toile */
  tuile('3 / span 1', '3 / span 2', 'tx-toile', `<span class="pl-tag pl-doux">Sprite</span>
    <div class="q06-c" style="color:${C.fluo}">${A.sprite('course', 1, { attrs: 'style="height:170px"' })}</div>${bas('Course', '1 / 4')}`),
  /* H · spécimen typographique */
  tuile('4 / span 1', '3 / span 2', 'noir', `<span class="pl-tag pl-doux">Spécimen</span><div style="position:absolute;left:20px;top:58px"><div class="t-large" style="font-size:92px">Aa</div><div class="t-titre" style="font-size:118px;color:${C.fluo};margin-top:6px">AZ</div></div>
    ${bas('Archivo · Bebas')}`),
  /* F · la coulure orange, en bande */
  tuile('5 / span 2', '3 / span 1', 'craie', `${A.coulure({ w: 600, h: 160, c: 'orange', seed: 14, cx: 0.56, cy: 0.64, rx: 0.4, ry: 0.3, attrs: 'style="position:absolute;inset:0;width:100%;height:100%"' })}
    <span class="pl-tag">La coulure</span>`),
  /* G · la barre de contrôle */
  tuile('5 / span 2', '4 / span 1', 'noir', `<span class="pl-tag pl-doux">Barre de contrôle</span>
    <div style="position:absolute;left:22px;right:22px;top:62px">${A.barre({ n: 2, style: 'height:30px' })}</div>
    <div style="position:absolute;left:22px;right:22px;bottom:18px;display:flex;justify-content:space-between;align-items:center">${A.code('CST', 'SER', '2026')}${A.mire(22)}</div>`),
  /* I · une photo dans le Cran */
  tuile('1 / span 3', '5 / span 2', 'noir', `<div class="tx-trame fine" style="position:absolute;inset:0;color:${C.fonte}"></div>
    <div class="dans-cran" style="position:absolute;left:50%;top:50%;width:460px;transform:translate(-50%,-40%);z-index:3">${A.photo('moto', { style: 'position:absolute;inset:0', pos: '45% 55%' })}</div>
    <span class="pl-tag pl-doux">Masque · la photo dans le Cran</span>`),
  /* J · le motif de blocs, et un titre du site par-dessus */
  tuile('4 / span 3', '5 / span 2', 'fluo', `${A.motif({ w: 640, h: 340, c: 'encre', l: 50, seed: 7, trou: 0.3, attrs: 'style="position:absolute;inset:0;width:100%;height:100%;opacity:.12"' })}
    <span class="pl-tag">Motif de blocs</span>
    <div class="t-titre h-84" style="position:absolute;left:22px;bottom:24px;z-index:3">Chaque objet,<br>sa ${A.surl('technique', 'noir')}</div>`) ];
document.getElementById('p').innerHTML = `
  ${A.entete()}
  <div class="pl-intro">
    <div class="pl-lbl doux">06 · La marque · En un coup d’œil</div>
    <div class="t-titre h-120">Dix pièces, une ${A.surl('marque')}</div>
  </div>
  <p class="pl-abs pl-z pl-chapo" style="left:84px;top:256px;width:900px;max-width:none;margin:0">Le logo, le fluo, la photo, le bloc, la coulure, les repères. Chaque pièce se reconnaît sans le logo.</p>
  <div class="q06-g">${tiles.join('')}</div>
  ${A.foot('06 · Bento de marque', 'Custom · direction artistique')}`;
</script></body>
