<!doctype html><meta charset="utf-8"><title>Custom — 31 · Composants d’interface</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="../brand/ecrans.css"><link rel="stylesheet" href="plates-b.css">
<script src="../brand/marque.js"></script><script src="../brand/ecrans.js"></script>
<style>
  /* Idée : une planche de pièces détachées. Les composants du site sont rangés sur deux grappes, comme une maquette à monter :
     un cadre, des carottes qui passent derrière, une attache par pièce, un numéro de pièce. Grappe sombre en haut, grappe claire en bas. */
  .p31-cel{position:absolute;border-radius:16px;background:var(--noir);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:flex;flex-direction:column;padding:16px 20px 18px}
  .p31-cel.clair{background:#fff;box-shadow:inset 0 0 0 1px rgba(3,1,14,.1);color:var(--encre)}
  .p31-cel>.p31-t{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase}
  .p31-cel>.p31-t b{font-weight:700;color:var(--fluo)}
  .p31-cel.clair>.p31-t b{color:var(--violet)}
  .p31-cel>.p31-t span{opacity:.6}
  .p31-cel>.p31-c{flex:1;display:flex;align-items:center;gap:22px}
  .p31-et{display:flex;flex-direction:column;align-items:flex-start}
  /* États du bouton principal (spécification) */
  .p31-survol{box-shadow:-5px 5px 0 0 #fff}
  .p31-actif{transform:translate(-3px,3px)}
  .p31-focus{outline:2px solid #fff;outline-offset:3px}
  .p31-off{background:var(--fonte)!important;color:var(--acier)!important;box-shadow:none!important}
  .p31-cel.clair .p31-focus{outline-color:var(--encre)}
  .p31-cel.clair .bouton.filet{box-shadow:inset 0 0 0 1px rgba(3,1,14,.35)}
  .p31-err .s-in{box-shadow:inset 0 0 0 2px var(--orange);color:#fff}
  .p31-msg{font-size:12.5px;color:var(--orange);margin-top:7px;font-weight:500}
</style>
<body><div class="plate" id="p" style="height:2050px"></div>
<script>
const A = Marque, C = A.COULEURS, S = A.site, B = S.blocs, D = A.DONNEES, NB = A.NB;
const fl = (c = 'currentColor', s = 0) => A.fleche(c, '', s);
const champ = (lb, ex, cls = '', sel, w = 180) => `<label class="s-champ" style="width:${w}px"><span>${lb}</span><span class="s-in ${cls}">${ex}${sel ? '<i class="s-chev"></i>' : ''}</span></label>`;
const et = (html, t) => `<div class="p31-et">${html}<div class="pb-etat">${t}</div></div>`;

/* Une grappe : cadre, carottes (entre les colonnes et les rangs), attaches, puis les pièces */
const grappe = (x0, y0, W, rows, cells, clair) => {
  const P = 28, G = 28, cw = (W - 2 * P - 3 * G) / 4, H = rows.reduce((a, h) => a + h, 0) + G * (rows.length - 1) + 2 * P;
  const ry = (r) => y0 + P + rows.slice(0, r).reduce((a, h) => a + h, 0) + r * G;
  const cx = (c) => x0 + P + c * (cw + G);
  const tr = clair ? C.acier : C.fonte;
  let svg = `<rect x="${x0}" y="${y0}" width="${W}" height="${H}" rx="26" stroke="${tr}" stroke-width="5"/>`;
  for (let c = 1; c < 4; c++) svg += `<path d="M${cx(c) - G / 2},${y0} V${y0 + H}" stroke="${tr}" stroke-width="3"/>`;
  for (let r = 1; r < rows.length; r++) svg += `<path d="M${x0},${ry(r) - G / 2} H${x0 + W}" stroke="${tr}" stroke-width="3"/>`;
  let html = '';
  cells.forEach(([c, r, span, no, nom, contenu, st = '']) => {
    const x = cx(c), y = ry(r), w = cw * span + G * (span - 1), h = rows[r];
    // attaches : à gauche, à droite et en haut de chaque pièce
    svg += `<path d="M${x - G / 2},${y + h / 2} H${x + 2} M${x + w - 2},${y + h / 2} H${x + w + G / 2} M${x + w / 2},${y - G / 2} V${y + 2}" stroke="${tr}" stroke-width="3.5"/>`;
    svg += `<rect x="${x + w / 2 - 15}" y="${y - G / 2 - 8}" width="30" height="16" rx="4" fill="${clair ? '#fff' : C.noir}" stroke="${tr}" stroke-width="2"/>`;
    svg += `<text x="${x + w / 2}" y="${y - G / 2 + 4}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="${clair ? C.encre : '#fff'}">${no}</text>`;
    html += `<div class="p31-cel${clair ? ' clair' : ''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${st}"><div class="p31-t"><b>${no}</b><span>${nom}</span></div><div class="p31-c">${contenu}</div></div>`;
  });
  return { H, html: `<svg class="pb-abs" style="left:0;top:0;z-index:1;overflow:visible" width="1400" height="2050" fill="none">${svg}</svg><div class="pb-abs" style="left:0;top:0;z-index:2">${html}</div>` };
};

const bp = 'Devis gratuit';
const sombre = grappe(84, 300, 1232, [150, 150, 196, 330, 128], [
  [0, 0, 4, 'A1', 'Bouton principal · cinq états', [
      et(`<span class="bouton s-g">${bp} ${fl()}</span>`, 'Défaut'),
      et(`<span class="bouton s-g p31-survol">${bp} ${fl()}</span>`, 'Survol : le bouton se décale d’un pas'),
      et(`<span class="bouton s-g p31-actif" style="background:${A.ECHELLE[600]}">${bp} ${fl()}</span>`, 'Actif'),
      et(`<span class="bouton s-g p31-focus">${bp} ${fl()}</span>`, 'Focus clavier'),
      et(`<span class="bouton s-g p31-off">${bp} ${fl()}</span>`, 'Désactivé')].join('')],
  [0, 1, 2, 'A2', 'Bouton secondaire', [
      et(`<span class="bouton filet s-g">Être rappelé</span>`, 'Défaut'),
      et(`<span class="bouton filet s-g" style="box-shadow:inset 0 0 0 1px #fff">Être rappelé</span>`, 'Survol'),
      et(`<span class="bouton filet s-g" style="opacity:.35">Être rappelé</span>`, 'Désactivé')].join('')],
  [2, 1, 1, 'A3', 'Boutons ronds', [et(`<span class="s-rond">${fl('#fff', 180)}</span>`, 'Précédent'), et(`<span class="s-rond on">${fl()}</span>`, 'Suivant'), et(`<span class="s-rond p31-focus">${fl('#fff')}</span>`, 'Focus')].join('')],
  [3, 1, 1, 'A4', 'Pastilles et codes', `<div style="display:flex;flex-direction:column;gap:10px">${A.pastille(`CST${NB}·${NB}BRO`, true)}<div style="display:flex;gap:8px">${A.pastille('Textile')}${A.pastille('Print')}</div></div>`],
  [0, 2, 3, 'A5', 'Champs · défaut, focus, rempli, erreur', [
      et(champ('E-mail*', 'nom@entreprise.fr'), 'Défaut'),
      et(champ('Prénom / Nom*', 'Prénom Nom', 'focus'), 'Focus'),
      et(champ('Type de projet', 'Textile', 'plein', true), 'Rempli'),
      `<div class="p31-et p31-err">${champ('Téléphone', '01 99 00', '')}<div class="p31-msg">Numéro incomplet</div></div>`].join(''), 'gap:0'],
  [3, 2, 1, 'A6', 'Puces en bloc', `<div style="display:flex;flex-direction:column;gap:14px">${['Production 100' + NB + '% intégrée', 'Devis sous 24' + NB + 'h', 'Sans engagement'].map((t) => `<span class="s-puce" style="font-size:15px"><i></i>${t}</span>`).join('')}</div>`],
  [0, 3, 2, 'A7', 'Cartes d’univers · active, au repos', [0, 1].map((i) => `<div class="s-u4${i ? '' : ' on'}" style="width:262px;height:252px;padding:22px;${i ? 'box-shadow:inset 0 0 0 1px var(--filet);border-radius:4px' : ''}">
      <div class="s-u4-h"><span class="t-mono">0${i + 1}${NB}·${NB}${i ? 'PRT' : 'TEX'}</span>${A.picto(i ? 'print' : 'textile', { c: i ? C.fluo : C.encre, attrs: 'style="height:62px;width:auto"' })}</div>
      <div class="t-titre s-u4-n" style="font-size:46px">${D.univers[i].nom}</div><p class="s-u4-p" style="font-size:12.5px;min-height:0">${D.univers[i].produits.slice(0, 3).join(' · ')}</p>
      <span class="s-u4-l" style="font-size:13px;margin-top:12px;padding-top:12px">Découvrir ${fl()}</span></div>`).join(''), 'padding-bottom:20px'],
  [2, 3, 1, 'A8', 'Carte de technique', `<div style="position:relative;width:252px;height:250px;zoom:.86"><div class="s-tc" style="left:0;top:0"><div class="s-tc-ph" style="height:196px;box-shadow:0 0 0 3px var(--fluo)">${A.photo('broderie', { pos: '50% 60%', style: 'position:absolute;inset:0' })}${A.pastille(`CST${NB}·${NB}BRO`, true)}</div><div class="t-titre s-tc-n">Broderie</div><p class="s-tc-p">${D.techniques.find((t) => t.cle === 'broderie').pour}</p></div></div>`],
  [3, 3, 1, 'A9', 'Carte de promesse', `<div class="carte fluo" style="width:100%;height:244px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end"><div>${A.pix('24h', { c: C.acier, attrs: 'style="height:70px;width:auto"' })}</div><b style="margin-top:16px;font-size:16px">Devis sous 24${NB}h</b><span style="font-size:12.5px;opacity:.72;margin-top:4px">Un devis détaillé en moins de 24 heures.</span></div>`],
  [0, 4, 4, 'A10', 'Navigation · menu actif souligné en fluo', `<div style="position:relative;width:1440px;height:88px;zoom:.805;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--filet)">${B.nav({ actif: 'L’atelier' })}</div>`, 'padding-bottom:12px'],
]);

const yc = 300 + sombre.H + 56;
const claire = grappe(84, yc + 64, 1232, [176, 196], [
  [0, 0, 2, 'B1', 'Surligneur · un mot par titre', `<div class="t-titre" style="font-size:44px;line-height:1.25;display:flex;flex-wrap:wrap;gap:4px 14px">${A.surl('fluo')}${A.surl('violet', 'violet')}${A.surl('orange', 'orange monte')}${A.surl('noir', 'noir')}${A.surl('droit', 'droit')}</div>`],
  [2, 0, 2, 'B2', 'Boutons sur fond clair', [et(`<span class="bouton noir s-g">${bp} ${fl()}</span>`, 'Sur blanc ou fluo'), et(`<span class="bouton s-g" style="box-shadow:inset 0 0 0 1px rgba(3,1,14,.12)">Devis gratuit</span>`, 'Fluo'), et(`<span class="bouton filet s-g p31-focus">Être rappelé</span>`, 'Focus')].join('')],
  [0, 1, 2, 'B3', 'Champs sur fond clair', `<div class="s-clair" style="display:flex;gap:16px">${champ('Entreprise', 'Nom de votre structure', '', false, 250)}${champ('Volume', 'Série', 'plein', true, 250)}</div>`],
  [2, 1, 1, 'B4', 'Options de devis', `<div style="display:flex;flex-direction:column;gap:8px;width:100%"><div class="s-opt on" style="height:46px;justify-content:center">Série</div><div class="s-opt" style="height:46px;justify-content:center;color:#fff">Petite série</div></div>`],
  [3, 1, 1, 'B5', 'Repères d’atelier', `<div style="display:flex;flex-direction:column;gap:14px;width:100%"><div style="display:flex;align-items:center;gap:18px">${A.mire()}<span class="pb-lbl">${A.code('CST', 'SER', '2026')}</span></div>${A.barre({ n: 2, style: 'width:100%' })}</div>`],
], true);

document.getElementById('p').innerHTML =
  A.entete() +
  `<div class="pb-abs pb-z pb-lbl doux" style="left:84px;top:104px">31${NB}·${NB}Composants d’interface${NB}·${NB}deux grappes</div>` +
  `<div class="pb-abs pb-z t-titre" style="left:84px;top:140px;font-size:92px">Les pièces ${A.surl('détachées')}</div>` +
  `<p class="pb-abs pb-z pb-txt doux" style="left:880px;top:150px;width:436px">Chaque écran du site se monte avec ces pièces. Chacune a ses états : défaut, survol, actif, focus, désactivé, erreur. Le focus est un filet blanc décalé de 3${NB}px ; au survol, le bouton se décale d’un pas, comme le Cran.</p>` +
  sombre.html +
  `<div class="pb-abs" style="left:0;right:0;top:${yc}px;bottom:0;background:var(--craie)"></div>` +
  `<div class="pb-abs tx-motif" style="left:0;right:0;top:${yc}px;bottom:0;--tm:110px;color:rgba(3,1,14,.045)"></div>` +
  `<div class="pb-abs pb-z pb-lbl" style="left:84px;top:${yc + 22}px;color:${C.encre};opacity:.65">Grappe claire${NB}·${NB}sur blanc, Craie ou fluo</div>` +
  `<div class="pb-abs pb-z pb-lbl" style="left:84px;top:270px;opacity:.65">Grappe sombre${NB}·${NB}sur Noir atelier</div>` +
  `<div class="pb-abs" style="left:0;top:0;width:1400px;color:${C.encre}">${claire.html}</div>` +
  A.foot('31 · Composants d’interface', 'Custom · direction artistique', C.encre);
{ const P = document.getElementById('p'); P.innerHTML = P.innerHTML.replace(/ ([:;?])(?=[ <])/g, NB + '$1'); }   // espace insécable avant : ; ?
document.getElementById('p').style.height = (yc + 64 + claire.H + 100) + 'px';
</script></body>
