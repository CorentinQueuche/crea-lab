<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css"><script src="../brand/marque.js"></script>
<style>
  /* 06 · Bento d'identité. Préfixe q6- */
  .q6-grid{position:absolute;left:40px;right:40px;top:84px;bottom:40px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:310px 310px 330px;gap:16px}
  .q6-abs{position:absolute;z-index:60}
  .q6-cote{font-family:var(--mono);font-size:3.4px;letter-spacing:.04em}
</style>
<body><div class="plate" id="p" style="height:1106px;background:var(--scene)"></div>
<script>
const A = Marque, C = A.COULEURS, N = A.ECHELLE, NB = '&nbsp;', SUR = '#F3F6F4', NOIR = '#04140A';
/* Le P-jauge sur sa grille : unité = 1 dans le repère du symbole (0 0 100 140) */
const P = (a, rho, cx = 50, cy = 50) => [cx + rho * Math.sin(a * Math.PI / 180), cy - rho * Math.cos(a * Math.PI / 180)];
const arc = (rho, a0, a1) => { const p0 = P(a0, rho), p1 = P(a1, rho); return `M${p0[0]},${p0[1]} A${rho},${rho} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${p1[0]},${p1[1]}`; };
let grille = '';
for (let x = -20; x <= 120; x += 10) grille += `<path d="M${x},-20V160" />`;
for (let y = -20; y <= 160; y += 10) grille += `<path d="M-20,${y}H120" />`;
const constr = `<svg viewBox="-24 -22 148 186" style="position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);height:510px;overflow:visible">
  <g stroke="rgba(255,255,255,.07)" stroke-width=".25" fill="none">${grille}</g>
  <path d="${A.symbolPath(85)}" fill="${C.net}" fill-rule="evenodd"/>
  <g fill="none" stroke="${SUR}" stroke-width=".3">
    <circle cx="50" cy="50" r="50" stroke-dasharray="1.2 1.2" opacity=".55"/><circle cx="50" cy="50" r="24" opacity=".55"/>
    <path d="M50,-14V50M50,50L${P(306, 64).join(',')}" opacity=".7"/>
    <path d="${arc(60, 0, 306)}" opacity=".9"/><path d="${arc(60, 306, 360)}" stroke-dasharray=".8 .8" opacity=".9"/>
    <path d="M-12,50H112M-12,140H40" stroke-dasharray="1 1" opacity=".45"/>
    <path d="M0,150V146M26,150V146M0,148H26" opacity=".8"/><path d="M-8,50H-4M-8,140H-4M-6,50V140" opacity=".8"/>
  </g>
  <g fill="${SUR}"><circle cx="50" cy="50" r="1.1"/><circle cx="26" cy="93.86" r="1.1"/></g>
  <text class="q6-cote" x="57" y="-10" fill="${SUR}">306° · 85${NB}%</text>
  <text class="q6-cote" x="12" y="-6" fill="${SUR}" opacity=".7">54°</text>
  <text class="q6-cote" x="3" y="156" fill="${SUR}" opacity=".7">26</text>
  <text class="q6-cote" x="-20" y="97" fill="${SUR}" opacity=".7">90</text>
  <text class="q6-cote" x="103" y="47" fill="${SUR}" opacity=".7">Ø 100</text>
</svg>`;
const T = (html, o) => A.tuile(html, o);
document.getElementById('p').innerHTML = `
  ${A.entete(A.ENTETE, SUR)}
  <div class="q6-grid">
    ${T(constr + `<div class="q6-abs" style="left:28px;bottom:24px">${A.bicolore(`Un anneau, un fût. <b>Gardé à 85${NB}%, ouvert de 15${NB}%.</b>`, 'font-size:21px;line-height:1.2')}</div>`, { lbl: 'Le P-jauge · grille de 10', style: 'grid-column:1/3;grid-row:1/3' })}
    ${T(`<div style="position:absolute;left:20px;bottom:-34px;font-size:250px;font-weight:500;letter-spacing:-.07em;line-height:.8">Aa</div>
      <div class="q6-abs" style="right:26px;top:22px;text-align:right"><div style="font-size:22px;font-weight:500;letter-spacing:-.03em">Instrument Sans</div><div class="cap" style="margin-top:8px;line-height:1.6">Regular · Medium · SemiBold</div></div>`, { ton: 'blanche', lbl: 'Texte' })}
    ${T(`<div class="q6-abs" style="left:26px;top:58px;font-size:20px;font-weight:500;letter-spacing:-.02em">Jusqu'à</div>
      <div class="chiffre q6-abs" style="left:18px;top:96px;font-size:200px">${A.pcH(85)}</div>
      <div class="q6-abs" style="left:26px;top:282px;font-size:20px;font-weight:500;letter-spacing:-.02em;line-height:1.1">de votre TJM,<br><span style="opacity:.55">au lieu de 54${NB}%.</span></div>
      <div class="q6-abs" style="left:26px;right:26px;bottom:26px">${A.jauge({ forme: 'blocs', p: 85, l: 266, g: 4, c: C.coffre, c2: C.coffre })}</div>`, { ton: 'vive', lbl: 'Le chiffre', style: 'grid-column:4;grid-row:1/3' })}
    ${T(`<div class="q6-abs" style="left:26px;right:26px;bottom:26px;display:flex;align-items:flex-end;gap:12px">${A.icone(104, 'net')}${A.icone(64, 'coffre')}${A.icone(44, 'blanc')}${A.icone(28, 'net')}</div>`, { ton: 'claire', lbl: 'Icône d\'app · 22,5${NB}%'.replace('${NB}', ' ') })}
    ${T(`<div class="g6 grain" style="position:absolute;inset:0"></div><div class="q6-abs" style="left:50%;top:56%;transform:translate(-50%,-50%) scale(.9)">${A.ncard('Facture générée', `Votre CRA d'octobre est validé. La facture <span style="white-space:nowrap">F-2026-010</span> de 12${NB}000${NB}€ HT est prête.`, { action: 'Voir la facture' })}</div>`, { ton: 'noire', lbl: 'En contexte' })}
    ${T(`<div class="grain" style="position:absolute;inset:0">${A.bandes({ n: 46, seed: 11, gap: 3 })}</div>
      <div class="q6-abs" style="left:34px;top:62px">${A.lockup(SUR, 'style="width:470px;display:block"')}</div>
      <div class="q6-abs pl-lbl" style="right:30px;top:24px;opacity:.6">Les bandes · les données deviennent le motif</div>`, { ton: 'noire', style: 'grid-column:2/5' })}
  </div>`;
</script></body>
