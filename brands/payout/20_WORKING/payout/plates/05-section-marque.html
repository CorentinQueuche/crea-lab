<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css"><script src="../brand/marque.js"></script>
<style>
  /* 05 · Bandeau de section 01, La marque. Même construction que 20 et 24 : bande de motif, bandeau à onglets, phrase bicolore, aperçu de la section. Préfixe q5- */
  .q5-mots{display:grid;grid-template-columns:repeat(4,1fr);margin-top:52px;border-top:1px solid var(--filet)}
  .q5-mots>div{padding:16px 28px 0 0}
  .q5-mots b{display:block;font-weight:500;font-size:17px;letter-spacing:-.02em;margin-top:8px}
  .q5-mots p{font-size:13.5px;line-height:1.4;opacity:.6;margin-top:5px;max-width:250px}
  .q5-bento{position:absolute;left:84px;top:236px;width:1232px;height:660px;display:grid;grid-template-columns:470px 1fr 1fr;grid-template-rows:1fr 1fr;gap:16px}
  .q5-pied{position:absolute;left:26px;right:26px;bottom:22px;z-index:60;display:flex;justify-content:space-between;align-items:flex-end}
  .q5-prop{display:flex;height:150px;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(6,10,8,.12)}
  .q5-prop i{display:block;min-width:0}
  .q5-leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:18px}
  .q5-leg span{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .q5-leg i{width:10px;height:10px;flex:none;box-shadow:inset 0 0 0 1px rgba(6,10,8,.18)}
</style>
<body><div class="plate" id="p" style="background:var(--coffre)"></div>
<script>
const A = Marque, C = A.COULEURS, NB = A.NB, SUR = '#F3F6F4';
const MOTS = [
  ['Net', 'On parle en chiffres, au centime. Un pourcentage vaut mieux qu\'un adjectif.'],
  ['Précis', 'Sur des données financières, l\'erreur n\'est pas permise. Chaque montant a sa source.'],
  ['Direct', 'Des phrases courtes, un bouton par écran, aucune notion fiscale sans son chiffre.'],
  ['Automatique', 'Le CRA devient la facture, la TVA se calcule seule. Zéro ressaisie.'],
];
/* Proportions des couleurs (MARQUE.md, règles chiffrées). Le Prélevé n'apparaît qu'ici sur la planche. */
const PROP = [['Coffre', 62, C.coffre], ['Ardoise', 14, C.ardoise], ['Net', 10, C.net], ['Texte clair', 6, SUR], ['Relevé, Blanc', 6, C.releve], ['Acier', 1.5, C.acier], ['Prélevé', .5, C.preleve]];
const bento = `<div class="q5-bento">
  ${A.tuile(`<div style="position:absolute;inset:0;display:grid;place-items:center;padding-bottom:40px">${A.symbol(C.net, 'style="height:440px;display:block"')}</div>
    <div class="q5-pied">${A.wordmark(SUR, 'style="height:30px;width:auto;display:block"')}<span class="pl-lbl doux">85${NB}% gardés · 15${NB}% qui partent</span></div>`,
    { ton: 'noire', lbl: 'Le symbole · le P-jauge', style: 'grid-row:1/3' })}
  ${A.tuile(`<div style="position:absolute;left:26px;right:26px;top:64px;z-index:60;display:flex;justify-content:space-between;align-items:flex-end">
      <div class="chiffre" style="font-size:150px;color:${C.net}">${A.pcH(85)}</div>
      <div style="font-size:15px;line-height:1.4;opacity:.72;width:220px;padding-bottom:10px">Sur 100${NB}€ facturés, jusqu'à 85${NB}€ pour vous, au lieu de 54.</div></div>
    <div style="position:absolute;left:26px;right:26px;bottom:26px">${A.jauge({ forme: 'segments', p: 85, avant: 54, h: 44, g: 3 })}</div>`,
    { lbl: 'La jauge · de 54 à 85', style: 'grid-column:2/4' })}
  ${A.tuile(`<div style="position:absolute;left:26px;right:26px;bottom:24px">
      <div class="q5-prop">${PROP.map(([n, v, h]) => `<i style="flex:${v} 1 0;background:${h}"></i>`).join('')}</div>
      <div class="q5-leg pl-lbl">${PROP.map(([n, v, h]) => `<span><i style="background:${h}"></i>${n} ${String(v).replace('.', ',')}</span>`).join('')}</div></div>`,
    { ton: 'blanche', lbl: 'La couleur · un noir, un vert' })}
  ${A.tuile(`<div style="position:absolute;inset:0;display:grid;place-items:center;padding-top:10px">${A.icone(140, 'coffre')}</div>
    <div class="q5-pied"><span class="pl-lbl" style="opacity:.7">Coffre sur Net</span><span class="pl-lbl" style="opacity:.7">16 px au minimum</span></div>`,
    { ton: 'vive', lbl: 'L\'icône d\'app' })}
</div>`;
document.getElementById('p').innerHTML = `
  <div class="grain" style="position:relative;height:300px;overflow:hidden">
    ${A.damier({ cols: 18, rows: 4, seed: 3, densite: .6, style: 'top:34%' })}
    ${A.entete(A.ENTETE, SUR)}
  </div>
  ${A.section({ titre: 'La marque', num: '01', actif: 0, style: 'margin-top:-44px;padding-bottom:0;z-index:2',
    phrase: `Une seule image, <b>la part qui vous revient.</b> Un noir, un vert électrique, <b>et des chiffres à la place des adjectifs.</b> Tout le système en découle${NB}: le symbole, la jauge, les bandes.` })}
  <div style="position:relative;background:var(--releve);color:var(--coffre);padding:0 56px;height:980px;display:flow-root;--filet:rgba(6,10,8,.12)">
    <div class="q5-mots">${MOTS.map(([t, d], i) => `<div><span class="pl-lbl doux">0${i + 1}${NB}· Mot-clé</span><b>${t}</b><p>${d}</p></div>`).join('')}</div>
    ${bento}
  </div>`;
</script></body>
