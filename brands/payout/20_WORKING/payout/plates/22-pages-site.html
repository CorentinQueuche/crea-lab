<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates-b.css"><script src="../brand/marque.js"></script>
<style>
  .s22-note{position:absolute;left:988px;width:328px;border-top:1px solid var(--filet);padding-top:14px}
  .s22-note .pb-lbl{color:var(--net)}
  .s22-note b{display:block;font-weight:500;font-size:22px;letter-spacing:-.03em;line-height:1.1;margin-top:10px}
  .s22-note p{font-size:14.5px;line-height:1.42;opacity:.62;margin-top:8px}
  .s22-url{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;opacity:.6}
</style>
<body><div class="plate" id="p" style="background:var(--coffre)"></div>
<script>
const A = Marque, NB = ' ', NNB = ' ', SUR = '#F3F6F4';
const K = 0.6, Y0 = 268, H = A.desk.SITE_H, KT = 328 / 414;
const yPage = (y) => Y0 + (46 + y) * K;           // position, dans la planche, d'un point de la page
const telBas = Y0 + 868 * KT;
const notes = [
  [900, '01 · Le modèle Payout', `Sur 100${NB}€ facturés`, `54 aujourd'hui, jusqu'à 85 avec Payout${NB}: deux grilles de 100 blocs, aucun jargon fiscal.`],
  [1660, '02 · Facturer. Déclarer. Garder.', 'Trois gestes, trois cartes', `Le seul passage clair de la page. Chaque geste montre son écran${NB}: le CRA, les échéances, le décompte.`],
  [2420, '03 · La web app', 'Le cockpit, tel quel', `Le tableau de bord de l'app sous le halo de la marque. Un cockpit à la place de trois outils.`],
  [3200, 'Appel final', 'Sur l\'aplat Net', `«${NB}Gardez la part qui vous revient.${NB}» Le seul aplat vert de la page, et le bouton qui mène au test d'éligibilité.`],
];
document.getElementById('p').innerHTML = `
  ${A.entete(A.ENTETE, SUR)}
  <div class="pb-abs" style="left:84px;top:104px;width:820px">
    <div class="pb-lbl doux">Site vitrine · une page · <span class="s22-url">payout.fr</span></div>
    <div class="pb-t" style="margin-top:16px">Le site, de haut en bas.</div>
  </div>
  <div class="pb-abs" style="left:988px;top:118px;width:328px">${A.bicolore(`Une page en cinq temps, <b>du chiffre au bouton.</b> Le simulateur tient aussi <b>dans la main.</b>`, 'font-size:21px;line-height:1.3')}</div>
  <div class="pb-abs" style="left:84px;top:${Y0}px">${A.browser(A.desk.sitePage(), K, { url: 'payout.fr', h: H })}</div>
  <div class="pb-abs" style="left:988px;top:${Y0}px">${A.phone(A.screens.simulateur(), KT)}</div>
  <div class="s22-note" data-y="${telBas + 30}" style="border-top:0;padding-top:0"><span class="pb-lbl">Lancement</span>
    <b>Le simulateur, sur mobile</b><p>Mêmes curseurs, même réponse${NB}: 600${NB}€ de TJM, 20 jours, 10${NB}200${NB}€ par mois au lieu de 6${NB}480${NB}€.</p></div>
  ${notes.map(([y, l, t, d]) => `<div class="s22-note" data-y="${yPage(y)}"><span class="pb-lbl">${l}</span><b>${t}</b><p>${d}</p></div>`).join('')}
`;
let bas = 0; document.querySelectorAll('.s22-note').forEach((n) => { const t = Math.max(+n.dataset.y, bas + 40); n.style.top = t + 'px'; bas = t + n.offsetHeight; });
document.getElementById('p').style.height = Math.ceil(yPage(H) + 84) + 'px';
</script></body>
