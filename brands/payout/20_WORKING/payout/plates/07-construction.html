<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css"><script src="../brand/marque.js"></script>
<style>
  /* 07 · Construction. Préfixe q7- */
  .q7-a{position:absolute;left:40px;right:40px;top:84px;height:860px;display:grid;grid-template-columns:1fr 420px;gap:16px}
  .q7-draw{position:relative;border-radius:36px;background:var(--sombre);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sur-scene) 10%,transparent);overflow:hidden}
  .q7-spec{display:flex;flex-direction:column;gap:16px}
  .q7-tab{border-radius:20px;background:var(--sombre);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sur-scene) 10%,transparent);padding:22px 24px}
  .q7-tab div{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--sur-scene) 10%,transparent);font-family:var(--mono);font-size:11.5px;line-height:1.45;letter-spacing:.01em}
  .q7-tab div:first-of-type{border-top:0}
  .q7-tab span:first-child{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
  .q7-etats{flex:1;border-radius:20px;background:var(--sombre);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sur-scene) 10%,transparent);padding:22px 24px;position:relative}
  .q7-b{position:absolute;left:40px;right:40px;top:960px;height:500px;border-radius:36px;overflow:hidden}
  svg text{font-family:var(--mono);letter-spacing:.04em}
</style>
<body><div class="plate" id="p" style="height:1500px;background:var(--scene)"></div>
<script>
const A = Marque, C = A.COULEURS, K = A.CONSTRUCTION, NB = '&nbsp;', SUR = '#F3F6F4', NOIR = '#04140A';
const r2 = (n) => Math.round(n * 100) / 100;
const P = (cx, cy, rho, a) => [r2(cx + rho * Math.sin(a * Math.PI / 180)), r2(cy - rho * Math.cos(a * Math.PI / 180))];
const arc = (cx, cy, rho, a0, a1) => { const p0 = P(cx, cy, rho, a0), p1 = P(cx, cy, rho, a1); return `M${p0} A${rho},${rho} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${p1}`; };
/* Cote horizontale ou verticale avec ses deux traits de rappel */
const coteH = (x0, x1, y, t, dy = -2.2, fs = 3.2) => `<path d="M${x0},${y - 2}V${y + 2}M${x1},${y - 2}V${y + 2}M${x0},${y}H${x1}"/><text x="${(x0 + x1) / 2}" y="${y + dy}" text-anchor="middle" font-size="${fs}" fill="${SUR}" stroke="none">${t}</text>`;
const coteV = (y0, y1, x, t, fs = 3.2) => `<path d="M${x - 2},${y0}H${x + 2}M${x - 2},${y1}H${x + 2}M${x},${y0}V${y1}"/><text x="${x - 3}" y="${(y0 + y1) / 2 + 1}" text-anchor="end" font-size="${fs}" fill="${SUR}" stroke="none">${t}</text>`;

/* ---------- A. Le P-jauge, repère 0 0 100 140 ---------- */
let g = ''; for (let x = -20; x <= 120; x += 10) g += `M${x},-20V160`; for (let y = -20; y <= 160; y += 10) g += `M-20,${y}H120`;
let g5 = ''; for (let x = -20; x <= 120; x += 2) g5 += `M${x},-20V160`; for (let y = -20; y <= 160; y += 2) g5 += `M-20,${y}H120`;
const J = K.jonction;
const sym = `<svg viewBox="-34 -30 168 196" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);height:790px;overflow:visible">
  <defs><pattern id="h" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width=".5" height="3" fill="${C.preleve}"/></pattern></defs>
  <path d="${g5}" stroke="rgba(255,255,255,.035)" stroke-width=".15" fill="none"/>
  <path d="${g}" stroke="rgba(255,255,255,.09)" stroke-width=".22" fill="none"/>
  <path d="${A.symbolPath(85)}" fill="${C.net}" fill-rule="evenodd" opacity=".94"/>
  <path d="${A.symbolParts(85).part}" fill="url(#h)"/>
  <g fill="none" stroke="${SUR}" stroke-width=".22">
    <circle cx="50" cy="50" r="50" stroke-dasharray="1 1" opacity=".6"/><circle cx="50" cy="50" r="24" stroke-dasharray="1 1" opacity=".6"/>
    <path d="M50,-8V50L${P(50, 50, 70, 306)}" opacity=".75"/>
    <path d="${arc(50, 50, 64, 0, 306)}"/>
    <path d="M-16,50H116M-16,140H34M26,40V150" stroke-dasharray=".8 .8" opacity=".45"/>
    <path d="M50,50L${P(50, 50, 24, 90)}" opacity=".9"/>
    ${coteH(0, 100, -16, 'Ø 100 · diamètre de l\'anneau')}
    ${coteH(76, 100, 30, '', -2)}<text x="88" y="27.6" text-anchor="middle" font-size="3.2" fill="${NOIR}" stroke="none">26</text>
    ${coteH(0, 26, 152, 'fût 26', 5.2)}
    ${coteV(50, 140, -10, '90')}
  </g>
  <g fill="${SUR}"><circle cx="50" cy="50" r=".9"/><circle cx="${J.x}" cy="${50 + J.y}" r=".9"/></g>
  <text x="52" y="56" font-size="3.2" fill="${SUR}">centre</text>
  <text x="58" y="48" font-size="3.2" fill="${SUR}">r 24</text>
  <text x="29" y="${50 + J.y + 1}" font-size="3.2" fill="${NOIR}">jonction · ${String(J.angle).replace('.', ',')}°</text>
  <text x="${P(50, 50, 68, 140)[0]}" y="${P(50, 50, 68, 140)[1]}" font-size="3.6" fill="${SUR}">306° · 85${NB}% gardés</text>
  <text x="${P(50, 50, 58, 333)[0] - 27}" y="${P(50, 50, 58, 333)[1] - 4}" font-size="3.6" fill="${C.preleve}">54° · 15${NB}% qui partent</text>
</svg>`;

/* ---------- B. Le logotype, repère 0 −40 648 180 ---------- */
const X = K.lettres, LT = A.LETTRES.ordre;
let lb = '';
const guides = [[-40, 'capitale · −40'], [-30, 'ascendante du t · −30'], [0, 'hauteur d\'x · 0'], [100, 'ligne de base · 100'], [140, 'descendante · 140']];
guides.forEach(([y, t]) => { lb += `<path d="M-50,${y}H698" stroke="${SUR}" stroke-width=".25" opacity="${y === 0 || y === 100 ? .5 : .25}" ${y === 0 || y === 100 ? '' : 'stroke-dasharray="1.2 1.2"'}/><text x="702" y="${y + 1.6}" font-size="5" fill="${SUR}" opacity=".6">${t}</text>`; });
const centres = { P: [50, 10], a: [156, 50], y: [278, 50], o: [394, 50], u: [510, 50], t: [636, 50] };
LT.forEach((ch, i) => { const [cx, cy] = centres[ch];
  lb += `<path d="${A.letterPath(ch, A.letterX(i))}" fill="${SUR}" fill-rule="evenodd" opacity=".95"/>`;
  lb += `<circle cx="${cx}" cy="${cy}" r="50" fill="none" stroke="${C.net}" stroke-width=".35" stroke-dasharray="1.4 1.4"/><circle cx="${cx}" cy="${cy}" r="24" fill="none" stroke="${C.net}" stroke-width=".35" stroke-dasharray="1.4 1.4"/><circle cx="${cx}" cy="${cy}" r="1.3" fill="${C.net}"/>`;
  lb += `<text x="${A.letterX(i) + (ch === 't' ? 24 : 50)}" y="-52" font-size="6" text-anchor="middle" fill="${SUR}" opacity=".75">${ch} · x ${A.letterX(i)}</text>`; });
const appr = [[100, 106, 6], [206, 228, 22], [328, 344, 16], [444, 460, 16], [560, 572, 12]];
appr.forEach(([x0, x1, v]) => { lb += `<rect x="${x0}" y="-40" width="${x1 - x0}" height="180" fill="${C.net}" opacity=".16"/><g stroke="${C.net}" stroke-width=".4"><path d="M${x0},157V163M${x1},157V163M${x0},160H${x1}"/></g><text x="${(x0 + x1) / 2}" y="172" font-size="6" text-anchor="middle" fill="${C.net}">${v}</text>`; });
const logo = `<svg viewBox="-60 -72 836 256" style="position:absolute;left:24px;right:24px;bottom:28px;width:calc(100% - 48px);overflow:visible">${lb}</svg>`;

document.getElementById('p').innerHTML = `
  ${A.entete(A.ENTETE, SUR)}
  <div class="q7-a">
    <div class="q7-draw"><span class="pl-tag">07 · Construction · le P-jauge sur sa grille de 10</span>${sym}</div>
    <div class="q7-spec">
      <div class="q7-tab"><div class="pl-lbl doux" style="display:block;border:0;padding:0 0 10px">La règle, en une ligne</div>
        ${A.bicolore(`<b>Un seul anneau, un seul fût.</b> Chaque lettre est faite de l'anneau, entier ou coupé, et du fût.`, 'font-size:20px;line-height:1.22;margin-bottom:16px')}
        <div><span>Anneau</span><span>Diamètre 100 · graisse 26<br>rayon intérieur 24</span></div>
        <div><span>Remplissage</span><span>306° depuis midi, sens horaire<br>soit 85${NB}% du tour</span></div>
        <div><span>Ouverture</span><span>54°, soit 15${NB}% du tour</span></div>
        <div><span>Fût</span><span>26 × 90, à gauche, depuis<br>le centre de l'anneau</span></div>
        <div><span>Jonction</span><span>x 26 · y 93,86 · ${String(J.angle).replace('.', ',')}°</span></div>
        <div><span>Boîte</span><span>0 0 100 140</span></div></div>
      <div class="q7-etats"><div class="pl-lbl doux">Le symbole est une jauge · symbolPath(pct)</div>
        <div style="position:absolute;left:24px;right:24px;bottom:22px;display:flex;justify-content:space-between;align-items:flex-end">
          ${[54, 65, 75, 85].map((p) => `<div style="display:grid;justify-items:center;gap:12px">${A.symbol(p === 85 ? C.net : SUR, 'style="height:96px;' + (p === 85 ? '' : 'opacity:.55') + '"', p)}<span class="pl-cote" style="${p === 85 ? `color:${C.net}` : 'opacity:.6'}">${p}${NB}%</span></div>`).join('')}</div>
        <p style="position:absolute;left:24px;right:24px;top:52px;font-size:14.5px;line-height:1.4;opacity:.7">À 54${NB}%, l'anneau ne touche pas encore le fût. À 85${NB}%, la boucle est faite.</p></div>
    </div>
  </div>
  <div class="q7-b g7 grain"><span class="pl-tag" style="left:30px;top:26px">Le logotype · hauteur d'x 100 · approches en vert</span>
    <span class="pl-tag" style="left:auto;right:30px;top:26px;opacity:.6">Repère 0 −40 648 180</span>${logo}</div>`;
</script></body>
