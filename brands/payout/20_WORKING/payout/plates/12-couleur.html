<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css"><script src="../brand/marque.js"></script>
<style>
  /* 12 · Fiche couleur. Préfixe q12- */
  .q12-net{position:absolute;left:40px;top:84px;width:560px;height:900px;border-radius:36px;overflow:hidden;color:var(--encre)}
  .q12-ech{position:absolute;left:616px;right:40px;top:84px;height:900px;border-radius:36px;overflow:hidden;display:grid;grid-template-rows:repeat(10,1fr)}
  .q12-l{display:grid;grid-template-columns:110px 112px 150px 1fr 1fr;align-items:center;padding:0 28px;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em}
  .q12-l b{font-family:var(--font);font-size:19px;font-weight:500;letter-spacing:-.02em}
  .q12-l em{font-style:normal;font-family:var(--font);font-size:13.5px;letter-spacing:0;opacity:.75;text-align:right}
  .q12-sw{position:absolute;left:40px;right:40px;top:1000px;height:250px;display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-radius:20px;overflow:hidden}
  .q12-s{position:relative;padding:20px 20px 18px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;line-height:1.6}
  .q12-s b{font-family:var(--font);font-size:26px;font-weight:500;letter-spacing:-.035em;line-height:1}
  .q12-prop{position:absolute;left:40px;right:40px;top:1290px}
  .q12-bar{display:flex;height:56px;border-radius:0;overflow:hidden;margin-top:14px}
  .q12-leg{display:flex;margin-top:14px}
  .q12-leg span{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;opacity:.7}
</style>
<body><div class="plate" id="p" style="height:1420px;background:var(--scene)"></div>
<script>
const A = Marque, C = A.COULEURS, N = A.ECHELLE, NB = '&nbsp;', SUR = '#F3F6F4', NOIR = '#04140A';
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)).join(' ');
const ct = (a, b) => String(A.contraste(a, b)).replace('.', ',');
const lit = (h) => (A.contraste(h, C.coffre) > A.contraste(h, SUR) ? NOIR : SUR);
const ROLE = { 50: 'Fond d\'alerte clair', 100: 'Pastille sur clair', 200: 'Lumière, cœur des halos', 300: 'Rampe', 400: 'Survol', 500: 'Aplat, jauge, bouton', 600: 'Actif', 700: 'Rampe, ombres', 800: 'Texte vert sur clair', 900: 'Fond de dégradé' };
const SW = [['Coffre', C.coffre, 'Fond de marque', SUR, `Texte clair ${ct(SUR, C.coffre)}`], ['Ardoise', C.ardoise, 'Panneaux, cartes', SUR, `Net ${ct(C.net, C.ardoise)}`], ['Acier', C.acier, 'Texte secondaire', NOIR, `Sur Coffre ${ct(C.acier, C.coffre)}`],
  ['Relevé', C.releve, 'Panneaux clairs', NOIR, `Coffre ${ct(C.coffre, C.releve)}`], ['Blanc', C.blanc, 'Cœur des halos', NOIR, `Net 800 ${ct(N[800], C.blanc)}`], ['Prélevé', C.preleve, 'Ce qui part, rare', NOIR, `Sur Coffre ${ct(C.preleve, C.coffre)}`]];
const PROP = [['Coffre', 62, C.coffre], ['Ardoise', 14, C.ardoise], ['Net', 10, C.net], ['Texte clair', 6, SUR], ['Relevé, Blanc', 6, C.releve], ['Acier', 1.5, C.acier], ['', .5, C.preleve]];
document.getElementById('p').innerHTML = `
  ${A.entete(A.ENTETE, SUR)}
  <div class="q12-net g-vif grain">
    <div class="pl-net" style="position:absolute;left:34px;top:30px;right:34px;display:flex;justify-content:space-between" ><span class="pl-lbl">12 · La couleur vive</span><span class="pl-lbl">500</span></div>
    <div class="pl-net" style="position:absolute;left:30px;top:96px;font-size:200px;font-weight:500;letter-spacing:-.065em;line-height:.8">Net</div>
    <div class="pl-net" style="position:absolute;left:34px;top:290px;max-width:400px;font-size:21px;line-height:1.25;font-weight:500;letter-spacing:-.02em">La part gardée. Seule couleur vive de la marque${NB}: elle éclaire, elle ne décore pas.</div>
    <div class="pl-net" style="position:absolute;left:34px;right:34px;bottom:34px">
      <div class="chiffre" style="font-size:88px">#36FF72</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;border-top:1px solid rgba(6,10,8,.2);padding-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;line-height:1.6">
        <div><span style="opacity:.6">RGB</span><br>${rgb(C.net)}</div><div><span style="opacity:.6">SUR COFFRE</span><br>${ct(C.net, C.coffre)} : 1</div><div><span style="opacity:.6">PART</span><br>10${NB}% des surfaces</div></div></div>
  </div>
  <div class="q12-ech">${Object.keys(N).map((k) => `<div class="q12-l" style="background:${N[k]};color:${lit(N[k])}${+k === 500 ? ';box-shadow:inset 6px 0 0 ' + NOIR : ''}">
      <b>Net ${k}</b><span>${N[k]}</span><span>RGB ${rgb(N[k])}</span><span>${lit(N[k]) === NOIR ? `Coffre ${ct(C.coffre, N[k])}` : `Texte clair ${ct(SUR, N[k])}`}</span><em>${ROLE[k]}</em></div>`).join('')}</div>
  <div class="q12-sw">${SW.map(([n, h, r, f, c]) => `<div class="q12-s" style="background:${h};color:${f};${h === C.coffre ? 'box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)' : ''}">
      <div><b>${n}</b><div style="margin-top:8px;opacity:.7">${r}</div></div>
      <div>${h}<br>RGB ${rgb(h)}<br><span style="opacity:.7">${c}</span></div></div>`).join('')}</div>
  <div class="q12-prop"><div style="display:flex;justify-content:space-between"><span class="pl-lbl doux">Proportions sur l'ensemble des supports</span><span class="pl-lbl doux">Le Net en aplat plein cadre${NB}: une fois sur huit au plus</span></div>
    <div class="q12-bar">${PROP.map(([n, v, h]) => `<i style="flex:${v};background:${h};${h === C.coffre ? 'box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)' : ''}"></i>`).join('')}</div>
    <div class="q12-leg" style="gap:26px">${PROP.map(([n, v, h]) => `<span style="display:flex;align-items:center;gap:8px"><i style="width:10px;height:10px;background:${h};box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)"></i>${n || 'Prélevé'} ${String(v).replace('.', ',')}${NB}%</span>`).join('')}</div></div>`;
</script></body>
