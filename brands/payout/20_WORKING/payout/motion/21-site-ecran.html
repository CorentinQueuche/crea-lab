<!doctype html><meta charset="utf-8"><title>Payout — V4, le site qui défile (contenu d'écran)</title>
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="motion.css">
<script src="../brand/marque.js"></script><script src="lib.js"></script>
<body><div class="m-stage" id="s" style="width:1920px;height:1200px"></div>
<script>
/* V4 · Défilement du site · 1920 × 1200 (16:10, l'écran du portable de la scène C) · 12 s · plein cadre, sans décor
   node tools/record.mjs motion/21-site-ecran.html out/motion/21-site-ecran.mp4 --w 1920 --h 1200 --fps 30 --dur 12 --planche --fixe 5.4
   Le navigateur remplit l'écran. Le curseur règle les trois curseurs du simulateur (TJM, jours, mois) ; le résultat s'allume et
   la jauge passe de 54 à 85 (6 480 € → 10 200 €). Puis la page défile, section par section, jusqu'à l'appel final ;
   la jauge du cockpit monte à son tour quand il entre. 1,5 s immobile à la fin. */
const A = Marque, W = 1920, H = 1200, K = W / 1440, VH = Math.round(H / K - 46);   // contenu visible : 1440 × 854 (unités de page)
const SCROLL_MAX = A.desk.SITE_H - VH;
const s = document.getElementById('s');
s.innerHTML = A.browser(`<div id="page" style="position:absolute;left:0;top:0;width:1440px">${A.desk.sitePage({ p: 54, anim: true })}</div>
  <div id="cur" style="position:absolute;left:0;top:0;width:30px;height:30px;z-index:80">${M.pointeur(30)}</div>`, K, { url: 'payout.fr', h: VH, extra: 'border-radius:0;box-shadow:none' });

const view = s.querySelector('.b-view'), page = s.querySelector('#page'), cur = s.querySelector('#cur'), fleche = cur.querySelector('svg');
const hero = page.querySelector('.d-site > div'), cockpit = page.querySelector('.browser');
const sim = page.querySelector('.d-sim'), ranges = [...sim.querySelectorAll('.u-range')], valeurs = [...sim.querySelectorAll('.d-sl .mt')];
const resultat = [...sim.children].slice(2, 5);
const CIBLES = [50, 87, 100];   // positions des curseurs dans le socle : 600 €, 20 jours, 12 mois

/* Coordonnées dans la vue (unités de page), quel que soit le traitement de zoom du navigateur */
/* Mesurées à chaque image, relativement à la page (les polices peuvent changer la mise en page avant la première image enregistrée) */
let pistes = [];
const mesure = () => { const pr = page.getBoundingClientRect(), ratio = pr.width / 1440;
  const pos = (el, fx) => { const r = el.getBoundingClientRect(); return [(r.left - pr.left + fx * r.width) / ratio, (r.top - pr.top + r.height / 2) / ratio]; };
  pistes = ranges.map((r) => [pos(r, 0), pos(r, 1)]); };   // début et fin de chaque piste
const REPOS0 = [1250, 790], REPOS1 = [1345, 818];   // REPOS1 : hors du bouton de l'appel final, sur lequel la vidéo s'arrête

/* Le scénario du curseur : [début, fin, de, à, curseur appuyé ?] */
const T = { glisse: [[1.1, 1.6], [2.15, 2.65], [3.15, 3.6]], va: [[0.5, 1.0], [1.7, 2.1], [2.7, 3.1]], quitte: [3.8, 4.35], calc: 3.4,
  defile: [[5.4, 900], [6.8, 1660], [8.2, 2420], [9.7, SCROLL_MAX]], dScroll: 0.8, cockpit: 8.4 };
const bout = (i, k) => [M.mix(pistes[i][0][0], pistes[i][1][0], (CIBLES[i] / 100) * k), pistes[i][0][1]];

const curseur = (t) => {
  let p = REPOS0, appui = 0;
  for (let i = 0; i < 3; i++) {
    const [a0, a1] = T.va[i], [g0, g1] = T.glisse[i], de = i ? bout(i - 1, 1) : REPOS0;
    if (t >= a0) p = [M.mix(de[0], bout(i, 0)[0], M.tw(t, a0, a1 - a0, M.cubicInOut)), M.mix(de[1], bout(i, 0)[1], M.tw(t, a0, a1 - a0, M.cubicInOut))];
    if (t >= g0) p = bout(i, M.tw(t, g0, g1 - g0, M.cubicInOut));
    appui = Math.max(appui, M.tw(t, g0 - 0.12, M.ETAT, M.cubicOut) * (1 - M.tw(t, g1, M.ETAT, M.cubicOut)));
  }
  if (t >= T.quitte[0]) { const k = M.tw(t, T.quitte[0], T.quitte[1] - T.quitte[0], M.cubicInOut), d = bout(2, 1); p = [M.mix(d[0], REPOS1[0], k), M.mix(d[1], REPOS1[1], k)]; }
  return { p, appui };
};

window.seek = (t) => {
  mesure();
  /* 1. Les trois curseurs du simulateur : vides au départ, réglés l'un après l'autre ; la valeur s'affiche au relâché */
  ranges.forEach((r, i) => { const [g0, g1] = T.glisse[i], k = M.tw(t, g0, g1 - g0, M.cubicInOut) * CIBLES[i];
    r.querySelector('b').style.width = k.toFixed(2) + '%'; const knob = r.querySelector('i'); knob.style.left = k.toFixed(2) + '%';
    const ap = M.tw(t, g0 - 0.12, M.ETAT) * (1 - M.tw(t, g1, M.ETAT)); knob.style.transform = `scale(${(1 + 0.18 * ap).toFixed(3)})`;
    valeurs[i].style.opacity = M.tw(t, g1, M.ETAT, M.cubicOut).toFixed(3); });
  /* 2. Le résultat s'allume quand le dernier curseur est posé, puis la jauge monte de 54 à 85 */
  const kR = 0.28 + 0.72 * M.tw(t, T.glisse[2][1], M.ETAT, M.cubicOut);
  resultat.forEach((el) => (el.style.opacity = kR.toFixed(3)));
  A.seekJauge(t - T.calc, { root: hero });
  A.seekJauge(t - T.cockpit, { root: cockpit });
  /* 3. Le curseur */
  const c = curseur(t);
  cur.style.transform = `translate(${(c.p[0] - 2).toFixed(1)}px, ${(c.p[1] - 2).toFixed(1)}px)`;
  fleche.style.transform = `scale(${(1 - 0.12 * c.appui).toFixed(3)})`;
  /* 4. Le défilement, section par section : départ et arrivée en douceur, comme une molette */
  let y = 0; T.defile.forEach(([d, cible], i) => { const de = i ? T.defile[i - 1][1] : 0; if (t >= d) y = M.mix(de, cible, M.tw(t, d, T.dScroll, M.cubicInOut)); });
  page.style.transform = `translateY(${(-y).toFixed(2)}px)`;
};
seek(0);
</script></body>
