<!doctype html><meta charset="utf-8"><title>Sillon · 10 · Les jeudis</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css">
<script src="../brand/marque.js"></script><script src="../brand/matiere.js"></script><script src="../brand/verse.js"></script>
<style>
  /* 10 · Les jeudis. Une frise : cinq affiches collées côte à côte sur le mur de la cave, comme un affichage sauvage.
     La phrase change chaque semaine, le verre reste. Format large, pas de bandeau. Préfixe p10-. */
  #p{height:650px}
  .p10-f{position:absolute;left:-46px;top:74px;display:flex;gap:10px;align-items:flex-start}
  .p10-f>div{position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.3),6px 10px 22px rgba(0,0,0,.6)}
  .p10-f>div::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,.07),rgba(0,0,0,0) 30%,rgba(0,0,0,.16))}
</style>
<body><div class="plate soir lumiere" id="p"></div>
<script>
const A = Marque, V = A.VOIX;
const AFFICHES = [
  { lignes: ['À', 'JE[U]DI.'], jus: ['paille', 'paille'], voix: V.carte, taille: 96, rot: -1.5 },
  { lignes: ['JE[U]DI,', 'ON GO[Û]TE.'], jus: ['maceration', 'glou'], voix: V.vitrine, rot: 1 },
  { lignes: ['D[U]', 'J[U]S.'], jus: ['maceration', 'paille'], voix: V.dos, fond: 'blanc', taille: 116, rot: -0.6 },
  { lignes: ['GLO[U].', ''], jus: ['glou'], voix: V.nappe, fond: 'cave', taille: 118, rot: 1.4 },
  { lignes: ['ON', 'O[U]VRE.'], jus: ['maceration', 'maceration'], voix: V.vitrine, taille: 90, tete: 'Bientôt aux Olivettes', rot: -1 },
];
document.getElementById('p').innerHTML = `<div class="p10-f net" data-voulu>${AFFICHES.map((a, i) => `<div style="transform:rotate(${a.rot}deg);margin-top:${[18, 0, 26, 6, 20][i]}px">${A.affiche({ l: 290, ...a })}</div>`).join('')}</div>
  <div class="pl-pied t-etq"><span>10 · Les jeudis</span><span>Une affiche par semaine : la phrase change, le verre reste</span><span>2026</span></div>`;
window.pret = Verse.tout();
</script></body>
