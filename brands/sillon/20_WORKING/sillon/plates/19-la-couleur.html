<!doctype html><meta charset="utf-8"><title>Sillon · 19 · La couleur</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css"><link rel="stylesheet" href="reseaux.css">
<script src="../brand/marque.js"></script><script src="../brand/matiere.js"></script><script src="../brand/verse.js"></script>
<style>
  /* 19 · La couleur. Pas de pastilles : chaque couleur est montrée dans sa matière, posée à plat sur le sergé et prise
     au flash. Les jus dans des verres de pierre (le moteur les rend du disque à la lie ; chaque repère est posé là où
     le ton se trouve vraiment dans le vin), le bleu en cinq coupons de sergé, le tuffeau en cinq papiers, les
     croisements en ronds de vin qui se recouvrent sur une nappe, l'image à niveau en trois tirages. Les codes et les
     contrastes sont petits et exacts. Préfixe r19-. */
  #p{height:1930px}
</style>
<body><div class="plate lumiere" id="p"></div>
<script>
const A = Marque, C = A.COULEURS, NB = A.NB, E = A.ECHELLES, el = document.getElementById('p');
const ratio = (a, b) => String(A.contraste(a, b)).replace('.', ',') + NB + ':' + NB + '1';
const meilleure = (h) => (A.contraste(h, C.cave) > A.contraste(h, C.tuffeau) ? C.cave : C.tuffeau);
const NOMS_BLEU = ['Nuit de cave', 'Veste neuve', 'Bleu de travail', 'Veste portée', 'Bleu lavé'];
const NOMS_PIERRE = ['Taille fraîche', 'Tuffeau', 'Craie', 'Pierre patinée', 'Pierre à l’ombre'];
/* le cran des ciseaux cranteurs, sur les quatre bords d'un coupon de 250 × 330 */
const cran = (() => { const l = 250, h = 330, d = 7, n = 18, m = 24, P = [];
  for (let i = 0; i <= n; i++) P.push([(i * l) / n, i % 2 ? d : 0]); for (let i = 1; i <= m; i++) P.push([i % 2 ? l - d : l, (i * h) / m]);
  for (let i = n - 1; i >= 0; i--) P.push([(i * l) / n, i % 2 ? h - d : h]); for (let i = m - 1; i > 0; i--) P.push([i % 2 ? d : 0, (i * h) / m]);
  return `polygon(${P.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(',')})`; })();

/* ---------- le bleu : cinq coupons de sergé, de la nuit de cave au bleu lavé ---------- */
const tissus = E.bleu.map((h, i) => { const enc = meilleure(h);
  return `<div class="r19-tissu" style="left:${84 + i * 132}px;top:${872 + [26, 6, 18, 0, 22][i]}px;transform:rotate(${[-6, -2.5, 1.5, 4, 7.5][i]}deg);z-index:${10 + i};--cran:${cran}">
    <div class="r19-drap" style="background:${h}"></div><div class="t-etq" style="color:${enc}">${NOMS_BLEU[i]}<br>${h}<br><span style="opacity:.8">${ratio(enc, h)}</span></div></div>`; }).join('');
/* ---------- le tuffeau : cinq papiers, de la taille fraîche à la pierre à l'ombre ---------- */
const papiers = E.tuffeau.map((h, i) => { const enc = A.contraste(C.bleu, h) >= 4.5 ? C.bleu : meilleure(h);
  return `<div class="r19-papier" style="left:${862 + i * 18}px;top:${870 + i * 52}px;transform:rotate(${[-2, 1, -1.2, 1.8, -0.8][i]}deg);background-color:${h};z-index:${10 + i}">
    <div class="t-etq" style="position:absolute;left:18px;top:14px;bottom:auto;color:${enc};display:flex;gap:14px"><span>${NOMS_PIERRE[i]}</span><span style="opacity:.75">${h}</span><span style="opacity:.75">${ratio(enc, h)}</span></div></div>`; }).join('');
/* ---------- les croisements : deux ronds de vin sur la nappe ; là où ils se recouvrent, la robe ---------- */
let nf = 0;
const flaque = (h, x, y, d) => { const id = 'fl' + ++nf; return `<div class="r19-flaque" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px"><svg viewBox="-70 -70 140 140" style="width:100%;height:100%;overflow:visible">
  <defs><filter id="${id}" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="${nf * 5}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation=".3"/></filter>
  <radialGradient id="${id}g" cx=".42" cy=".38"><stop offset="0" stop-color="${h}" stop-opacity=".82"/><stop offset=".86" stop-color="${h}" stop-opacity=".92"/><stop offset="1" stop-color="${h}" stop-opacity="1"/></radialGradient></defs>
  <g filter="url(#${id})"><circle r="62" fill="url(#${id}g)"/><circle r="61" fill="none" stroke="#3a1a00" stroke-opacity=".28" stroke-width="2.4"/><ellipse cx="-22" cy="-26" rx="20" ry="9" transform="rotate(-35 -22 -26)" fill="#fff" opacity=".28"/></g></svg></div>`; };
const croisements = A.CROISEMENTS.map((x, i) => { const cx = 46 + i * 232;
  return flaque(x.tons[0], cx, 84, 128) + flaque(x.tons[1], cx + 74, 84, 128) +
    `<div class="rs-leg" style="left:${cx}px;top:236px"><div class="t-etq">${x.nom} · ${x.hex}</div><div class="r19-code" style="opacity:.7">${A.NOMS[x.a].toLowerCase()} ${x.tons[0]} × ${A.NOMS[x.b].toLowerCase()} ${x.tons[1]}</div></div>`; }).join('');
/* ---------- l'image à niveau : trois tirages, droits (la ligne du jus ne penche jamais) ---------- */
const tirages = [['verre-penche', 'maceration', 0.5], ['comptoir', 'glou', 0.42], ['trois-jus', 'paille', 0.36]].map(([n, j, v], i) =>
  `<div class="r19-tirage" style="left:${870 + i * 150}px;top:${1374 + [0, 14, 4][i]}px;z-index:${20 + i}">${A.photo(n, { mode: 'niveau', jus: j, niveau: v, style: 'width:128px;height:170px' })}<span class="t-etq" style="font-size:10px">${A.NOMS[j]} · à niveau</span></div>`).join('');

el.innerHTML = `<div class="net" style="position:absolute;inset:0">
    <div class="pl-lbl t-etq">19 · La couleur</div><div class="pl-lbl-d t-etq">Huit couleurs, cinq tons chacune · montrées dans leur matière</div>
    <div id="grand" class="r19-u" style="left:70px;top:118px"></div><div id="tons-grand"></div>
    <div id="glou" class="r19-u" style="left:1046px;top:150px"></div><div id="paille" class="r19-u" style="left:1046px;top:476px"></div>
    <div class="t-sous" style="position:absolute;left:84px;top:640px;font-size:52px;white-space:nowrap">Du disque à la lie.</div><div class="t-etq" style="position:absolute;left:88px;top:708px;opacity:.8">Le moteur rend chaque jus ; chaque repère est posé là où le ton se trouve dans le vin</div>
    ${tissus}${papiers}
    <div class="r19-nappe" style="left:84px;top:1352px;width:744px;height:430px;transform:rotate(-1.2deg)">
      <div class="t-etq" style="position:absolute;left:46px;top:30px">Les croisements · deux jus l’un sur l’autre</div>${croisements}
      <div class="t-sous" style="position:absolute;left:46px;bottom:30px;font-size:22px">Deux jus qui se croisent font une robe.</div></div>
    ${tirages}
    <div style="position:absolute;right:84px;top:1622px;z-index:30">${A.contre({ lot: '19', sujet: 'Contrastes mesurés', lignes: [['Tuffeau sur bleu', ratio('tuffeau', 'bleu')], ['Fond de cave sur tuffeau', ratio('cave', 'tuffeau')], ['Fond de cave sur macération', ratio('cave', 'maceration')], ['Macération sur bleu', ratio('maceration', 'bleu') + ' · jamais en texte']], l: 330 })}</div>
    <div class="pl-pied t-etq"><span>19 · La couleur</span><span>Un jus n’existe que dans un creux ; le bleu est une veste, le tuffeau un papier</span><span>2026</span></div>
  </div>`;

/* Les repères : le moteur rend le vin ; un double du même rendu, sans la photo de matière (donc lisible), dit où se
   trouve chaque ton. On cherche chaque ton dans sa zone (le disque en surface, le bord contre la paroi, la robe et le
   cœur au milieu, la lie au fond) et on pose le repère sur le pixel le plus proche. */
function reperes(boite, o, cible, numeros) {
  const cv = document.createElement('canvas'), tw = document.createElement('canvas'); boite.appendChild(cv);
  const inf = Verse.rendre(cv, o); Verse.rendre(tw, { ...o, texture: false });
  const kk = tw.width / parseFloat(tw.style.width), d = tw.getContext('2d').getImageData(0, 0, tw.width, tw.height).data, W = tw.width, H = tw.height;
  const vin = (i) => d[i * 4 + 3] > 230 && d[i * 4] - d[i * 4 + 2] > 50;
  let x0 = W, x1 = 0, y0 = H, y1 = 0; for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (vin(y * W + x)) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const E5 = A.ECHELLES[o.jus[0]].map((h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))), L = x1 - x0, Hh = y1 - y0;
  const zones = [[0.55, 1, 0, 0.1], [0, 0.16, 0.22, 0.42], [0.3, 0.75, 0.42, 0.6], [0.3, 0.75, 0.64, 0.8], [0.1, 0.9, 0.86, 1]];
  const pts = E5.map((c, t) => { const [a, b, u, v] = zones[t]; let best = null;
    for (let y = y0 + u * Hh; y <= y0 + v * Hh; y += 2) for (let x = x0 + a * L; x <= x0 + b * L; x += 2) { const i = ((y | 0) * W + (x | 0)); if (!vin(i)) continue;
      const e = (d[i * 4] - c[0]) ** 2 + (d[i * 4 + 1] - c[1]) ** 2 + (d[i * 4 + 2] - c[2]) ** 2; if (!best || e < best.e) best = { e, x, y }; }
    return best ? { x: best.x / kk - 4, y: best.y / kk - 4 } : null; });
  pts.forEach((p, t) => { if (!p) return; const m = document.createElement('i'); m.className = 'r19-pt'; m.style.left = p.x + 'px'; m.style.top = p.y + 'px'; if (numeros) { m.innerHTML = `<b>${t + 1}</b>`; m.dataset.voulu = ''; } boite.appendChild(m); });
  return { inf, pts };
}

window.pret = Verse.pret().then(() => {
  /* le grand verre : la macération, le jus de la maison ; ses cinq tons écrits à droite, reliés à leur repère */
  const g = document.getElementById('grand'), R0 = reperes(g, { texte: '[U]', taille: 400, jus: ['maceration'], p: 0.9, fond: 'bleu' }), gx = 70, gy = 118;
  const col = 740, ys = R0.pts.map((p) => gy + p.y); for (let t = 1; t < 5; t++) ys[t] = Math.max(ys[t], ys[t - 1] + 34);
  document.getElementById('tons-grand').innerHTML = R0.pts.map((p, t) => { if (!p) return ''; const X = gx + p.x, Y = gy + p.y, dx = col - 14 - X, dy = ys[t] - Y;
    return `<i class="r19-trait" style="left:${X}px;top:${Y}px;width:${Math.hypot(dx, dy)}px;transform:rotate(${Math.atan2(dy, dx)}rad)"></i>
      <div class="r19-ton" style="left:${col}px;top:${ys[t] - 9}px"><span class="pl-num">${t + 1}</span><span class="t-etq">${A.TONS[t]}</span><span class="r19-code">${E.maceration[t]}</span></div>`; }).join('') +
    `<div class="t-etq" style="position:absolute;left:${col}px;top:${ys[4] + 40}px;width:250px">Macération · ${A.MATIERES.maceration.dit.toLowerCase()}<br><span class="r19-code">robe ${C.maceration} · fond de cave dessus ${ratio('cave', 'maceration')}</span></div>`;
  /* glou et paille, plus petits, repères numérotés et leurs codes dessous */
  [['glou', 'glou'], ['paille', 'paille']].forEach(([id, j]) => { const b = document.getElementById(id), r = reperes(b, { texte: '[U]', taille: 150, jus: [j], p: 0.86, fond: 'bleu' }, null, true);
    b.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:0;top:${r.inf.h + 34}px;width:270px"><div class="t-etq" style="margin-bottom:6px">${A.NOMS[j]} · ${A.MATIERES[j].dit.toLowerCase()}</div>${E[j].map((h, t) => `<div style="display:grid;grid-template-columns:20px 74px auto;align-items:baseline"><span class="pl-num" style="font-size:11px">${t + 1}</span><span class="t-etq" style="font-size:11px">${A.TONS[t]}</span><span class="r19-code" style="font-size:11px">${h}</span></div>`).join('')}</div>`); });
});
</script></body>
