<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Rendu d'une page du guide</title>
<!-- RENDU D'UNE PAGE DU GUIDE à 1280 × 720 — gabarit neutre (deck/render.html).
     CONTRAT : tools/deck.mjs ouvre ce fichier, lit window.GuideOrder, appelle window.show(clé) pour chaque page puis
     capture la zone 1280 × 720 en ×2. show() écrit la page dans #in (.mp-in) puis appelle GuideApres(#in) : la capture
     suit le rendu complet. Garder l'identifiant #in, la classe .mp-in et window.show.
     À ADAPTER : la liste des feuilles et des scripts, si le socle en a d'autres (brand/ecrans.css, brand/ecrans.js…) :
     les mêmes, dans le même ordre, que dans site/presentation.html.
     À la main : ouvrir deck/render.html#<clé> affiche cette page (la première par défaut). -->
<link rel="stylesheet" href="../brand/marque.css">
<link rel="stylesheet" href="pages.css">
<script src="../brand/marque.js"></script>
<script src="pages.js"></script>
<body>
<div class="mp-in" id="in"></div>
<script>
window.show = (k) => {
  const el = document.getElementById('in');
  el.innerHTML = window.GuidePages[k];
  if (typeof window.GuideApres === 'function') window.GuideApres(el);
};
window.show(decodeURIComponent(location.hash.slice(1)) in window.GuidePages ? decodeURIComponent(location.hash.slice(1)) : window.GuideOrder[0]);
</script>
</body>
</html>
