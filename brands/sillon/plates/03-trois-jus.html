<!doctype html><meta charset="utf-8"><title>Sillon · 03 · Les trois jus</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css">
<script src="../brand/marque.js"></script><script src="../brand/matiere.js"></script><script src="../brand/verse.js"></script>
<style>
  /* 03 · Les trois jus. Trois bouteilles nues, à contre-jour : on les habille. Chacune reçoit son étiquette de face
     (le creux du logotype prend le jus de la bouteille, le nom penche du degré du vin) et, dessous, sa contre-étiquette.
     Tout est posé dans les pixels de la photo ; les éclats du verre repassent par-dessus le papier. Préfixe p03-. */
  .cyl .ce.papier{box-shadow:none;border-radius:0}
  .p03-plat{display:flex;gap:18px;align-items:flex-end}
  .p03-plat>div{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .p03-plat .etq{box-shadow:0 0 0 1px rgba(14,22,56,.12),0 14px 26px -14px rgba(14,22,56,.55)}
</style>
<body><div class="plate clair" id="p"></div>
<script>
const A = Marque, C = A.COULEURS, NB = A.NB, B = A.DONNEES.bouteilles, CX = [805, 1203, 1603];
const rgba = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;
/* une bouteille habillée : l'étiquette (212 × 284) et la contre-étiquette (156 × 106), collées sur le verre */
const CLARTE = { maceration: 1.8, glou: 2.6, paille: 1.24 };
const habit = (b, i) => A.surVerre('trois-jus', A.etiquette({ jus: b.jus, degre: b.degre, l: 212 }), { x: CX[i], y: 954, l: 212, h: 284, clarte: CLARTE[b.jus], creux: 0.1 }) +
  A.surVerre('trois-jus', `<div style="zoom:.619">${A.contre({ lot: '11', lignes: [['Jus', A.NOMS[b.jus]]], grands: [`75${NB}cl`, A.deg(b.degre)], jus: b.jus })}</div>`, { x: CX[i], y: 1164, l: 156, h: 106, clarte: CLARTE[b.jus], creux: 0.1 });
const habits = B.map(habit).join('');

document.getElementById('p').innerHTML =
  A.scene('trois-jus', habits + `<div class="t-etq pl-sur-photo" style="left:144px;top:96px;font-size:20px">03 · Les trois jus</div><div class="t-etq pl-sur-photo" style="right:144px;top:96px;font-size:20px;text-align:right">Étiquette et contre-étiquette, sur chaque bouteille</div>`) +
  `<div class="pl-bande fond-tuffeau lumiere"><div class="net" style="grid-template-columns:430px 1fr">
     <div class="pl-plan">${A.scene('trois-jus', habits, { l: 430, cadre: [1040, 770, 330, 470] })}<span class="t-etq">Gros plan · le glou</span></div>
     <div>
       <div class="pl-voix" style="color:${C.bleu}">Non filtré.<br>Nous non plus.</div>
       <p class="t-chapo" style="max-width:560px;margin:22px 0 34px">Le creux du logotype prend le jus de la bouteille. Le nom penche du degré du vin, et la contre-étiquette dit le reste : la contenance, le degré, le lot du mois.</p>
       <div class="p03-plat">${B.map((b) => `<div>${A.etiquette({ jus: b.jus, degre: b.degre, l: 168 })}<span class="t-etq">${A.NOMS[b.jus]} · ${b.dit} · ${A.deg(b.degre)}</span></div>`).join('')}</div>
     </div></div>
     <div class="pl-pied t-etq"><span>03 · Les trois jus</span><span>${A.DESCRIPTEUR} · ${A.LIEU}</span><span>2026</span></div>
   </div>`;
</script></body>
