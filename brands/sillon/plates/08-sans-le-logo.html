<!doctype html><meta charset="utf-8"><title>Sillon · 08 · Sans le logo</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../brand/marque.css"><link rel="stylesheet" href="plates.css">
<script src="../brand/marque.js"></script><script src="../brand/matiere.js"></script><script src="../brand/verse.js"></script>
<style>
  /* 08 · Sans le logo. Ce qui fait reconnaître Sillon quand on retire son nom : les éléments du kit, chacun montré par la
     fonction du socle qui le produit, en matière. Ni le nom ni le logotype ne figurent sur cette planche. Préfixe p08-. */
  .p08-s{position:relative}
  .p08-g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .p08-t{position:relative;height:440px;overflow:hidden}
  .p08-t>.net{position:absolute;inset:0}
  .p08-l{position:absolute;left:22px;right:22px;bottom:18px;display:grid;grid-template-columns:30px 1fr;align-items:baseline;z-index:9}
  .p08-l p{margin:4px 0 0;max-width:470px}
  .p08-ton{display:grid;grid-template-columns:repeat(5,1fr);height:26px}
  .p08-deg{display:flex;align-items:flex-end;justify-content:space-between}
  .p08-deg>div{display:flex;flex-direction:column;align-items:center;gap:10px}
  .p08-abc{position:relative}
  .p08-abc span{position:absolute;transform:translateX(-50%);white-space:nowrap}
</style>
<body><div class="plate" id="p"></div>
<script>
const A = Marque, C = A.COULEURS, NB = A.NB, cv = A.cvs, ANGLES = [0, 12, 24, 36, 48];
const leg = (n, nom, texte, c = 'inherit') => `<div class="p08-l"><span class="pl-num" style="color:${c}">${n}</span><div><div class="t-etq">${nom}</div><p class="t-petit">${texte}</p></div></div>`;
const tons = (k) => `<div class="p08-ton">${A.ECHELLES[k].map((h) => `<i style="background:${h}"></i>`).join('')}</div>`;

document.getElementById('p').innerHTML =
  `<div class="p08-s lumiere" style="height:790px"><div class="net" style="position:absolute;inset:0">
     <div class="pl-lbl t-etq">08 · Sans le logo</div><div class="pl-lbl-d t-etq">Sept éléments · ni nom ni logotype sur cette planche</div>
     <div class="pl-abs" style="left:64px;top:140px"><canvas data-verse="JE[U]DI," data-taille="176" data-angle="-12" id="t1"></canvas></div>
     <div class="pl-abs" style="left:128px;top:306px"><canvas data-verse="ON GO[Û]TE." data-taille="176" data-angle="-12" data-jus="glou" id="t2"></canvas></div>
     <p class="t-chapo pl-abs" style="right:84px;top:108px;width:320px;margin:0">Retirez le nom. Il reste une voix qui a ses verres, trois jus qui ne se ressemblent pas, une pente de 12° et un niveau qui ne bouge pas.</p>
     <div class="pl-abs" id="ce" style="right:84px;bottom:60px"></div>
   </div></div>` +
  `<div class="p08-s fond-tuffeau lumiere" style="padding:14px 14px 0"><div class="net p08-g">
     <div class="p08-t fond-bleu"><div class="net"><div style="position:absolute;left:0;top:26px"><canvas id="verres"></canvas></div>${leg('1', 'Le creux rempli', 'L’unité. Un sillon vu en coupe est un verre. Les verres penchent chacun à leur façon ; toutes les surfaces sont horizontales.', C.maceration)}</div></div>
     <div class="p08-t fond-cave"><div class="net"><div style="position:absolute;left:34px;top:34px;display:flex;gap:26px">${A.JUS.map((j) => `<div style="width:174px">${cv('[U]', { taille: 120, jus: j, p: 0.86, fond: 'cave' })}<div style="margin-top:14px">${tons(j)}</div><div class="t-etq" style="margin-top:8px">${A.NOMS[j]}</div><div class="t-petit t-doux">${A.MATIERES[j].dit}</div></div>`).join('')}</div>
       <div style="position:absolute;left:34px;top:300px;display:flex;gap:10px;align-items:center">${A.CROISEMENTS.map((x) => `<span style="display:inline-flex;align-items:center;gap:7px"><i style="width:34px;height:22px;background:linear-gradient(90deg,${x.tons[0]} 0 33%,${x.hex} 33% 67%,${x.tons[1]} 67%)"></i><span class="t-etq" style="font-size:10px">${x.nom}</span></span>`).join('')}</div>
       ${leg('2', 'Les trois jus', 'La matière. Du disque à la lie ; trouble, limpide ou perlant. Deux jus qui se croisent donnent une robe : tuilé, pelure d’oignon, ambre.', C.maceration)}</div></div>
     <div class="p08-t fond-blanc"><div class="net"><div style="position:absolute;left:30px;top:34px;color:${C.bleu}"><span class="t-titre image" style="--photo:url('../photos/depot.jpg');font-size:158px">D<b>U</b> J<b>U</b>S.</span>
         <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;margin-top:20px;width:600px">${Object.values(A.VOIX).slice(0, 4).map((v) => `<div class="t-sous" style="font-size:17px;line-height:1.08">${v}</div>`).join('')}</div></div>
       ${leg('3', 'La voix à verres', 'Capitales serrées, verres larges ; une photo peut passer dans les lettres. Et des phrases de comptoir, écrites sur les objets.', C.bleu)}</div></div>
     <div class="p08-t fond-bleu"><div class="net"><div class="p08-deg" style="position:absolute;left:30px;right:30px;top:60px">${ANGLES.map((a, i) => `<div>${cv('[U]', { taille: 62, angle: a, id: 'd' + i })}<span class="t-etq">${A.deg(a)} · <span data-cl-de="d${i}">…</span></span></div>`).join('')}</div>
       <div class="t-sous" style="position:absolute;left:30px;top:262px;font-size:30px">Ça penche, ça tient.</div>
       ${leg('4', 'Douze degrés', 'La règle et le mouvement. Tout penche de 12°, le vin jamais : plus le verre penche, moins il tient. Les contenances sont mesurées, pas écrites.', C.maceration)}</div></div>
     <div class="p08-t fond-cave"><div class="net"><div style="position:absolute;left:22px;top:22px;display:flex;gap:12px;align-items:flex-start">${A.photo('comptoir', { mode: 'niveau', niveau: 0.5, cote: true, style: 'width:250px;height:290px' })}${A.photo('jeudi', { mode: 'niveau', jus: 'paille', niveau: 0.42, style: 'width:190px;height:290px' })}<div style="margin:22px 0 0 26px">${A.cadre('caviste', { l: 150, h: 220, mode: 'niveau', jus: 'glou', niveau: 0.45 })}</div></div>
       ${leg('5', 'L’image à niveau', 'Le traitement d’image. Toute photo se remplit jusqu’à une ligne horizontale : un jus dessous, la photo claire dessus. Le cadre peut pencher, pas la ligne.', C.maceration)}</div></div>
     <div class="p08-t fond-bleu"><div class="net"><div style="position:absolute;left:34px;top:34px;display:flex;gap:26px;align-items:flex-start">${A.contre({ lot: '08', sujet: 'Sans le logo', lignes: [['Mention', 'Non filtré'], ['Jus', 'Les trois']], grands: [`75${NB}cl`, A.deg(12)], nom: false, voix: A.VOIX.dos })}${A.contre({ lot: '08', lignes: [['Contenu', `3${NB}×${NB}75${NB}cl`]], grands: [`225${NB}cl`, A.deg(11)], nom: false, jus: 'glou', sanitaire: true, l: 280 })}</div>
       ${leg('6', 'La contre-étiquette', 'La marge du métier. Le petit papier du dos de la bouteille, toujours droit : il tient les compositions qui penchent, mesure les photos et porte la mention sanitaire.', C.maceration)}</div></div>
   </div>
   <div class="net" style="padding:70px 70px 120px"><div id="abc" class="p08-abc" style="color:${C.bleu}"></div>
     <div class="pl-legende" style="margin-top:36px;color:${C.cave}"><span class="pl-num" style="color:${C.bleu}">7</span><div><div class="t-etq">L’abécédaire à ras bord</div><p class="t-petit" style="max-width:640px">La pièce maîtresse. Le moteur remplit chaque lettre de ce qu’elle peut physiquement tenir et le mesure : un U large et droit fait un verre, 12,5${NB}cl. <span id="abc-total"></span></p></div></div></div>
   <div class="pl-pied t-etq" style="color:${C.cave}"><span>08 · Sans le logo</span><span>${A.DESCRIPTEUR} · ${A.LIEU}</span><span>2026</span></div></div>`;

window.pret = Verse.tout().then(() => {
  const cl = ['t1', 't2'].reduce((a, id) => a + +document.getElementById(id).dataset.cl, 0);
  document.getElementById('ce').innerHTML = A.contre({ lot: '08', sujet: 'Sans le logo', lignes: [['Titre', 'Jeudi, on goûte.'], ['Pente', A.deg(-12)], ['Jus', 'Macération, glou']], grands: [Verse.cl(cl), A.deg(12)], nom: false });
  Verse.verres(document.getElementById('verres'), { w: 679, h: 290, cols: 5, rangs: 2, taille: 58, quinconce: false, marge: 16, angle: (i, j, u) => (u - 0.5) * 72 + (j ? 8 : -8), jus: (i, j) => A.JUS[(i + j) % 3], niveau: (i, j) => 0.45 + 0.35 * Math.abs(Math.sin(i * 1.7 + j)) });
  /* l'abécédaire : deux rangs de lettres larges, en encre sur le papier, la contenance de chacune dessous */
  const abc = document.getElementById('abc'), RANGS = ['ABCDEFGHIJKLM', 'NOPQRSTUVWXYZ'], opt = (r, taille) => ({ texte: `[${r}]`, taille, tout: true, jus: A.JUS, c: 'bleu', inter: 0.06, p: 1, mode: 'imprime' });
  const TT = Math.floor((100 * 1250) / Math.max(...RANGS.map((r) => Verse.mesurer(opt(r, 100)).l))); let total = 0, html = '', y = 0;
  const rendus = RANGS.map((r) => { const c = document.createElement('canvas'); return { c, res: Verse.rendre(c, opt(r, TT)) }; });
  rendus.forEach(({ c, res }) => { c.style.position = 'absolute'; c.style.left = '0'; c.style.top = y + 'px';
    res.lettres.forEach((g, i) => { const v = res.poches.filter((q) => q.i === i).reduce((a, q) => a + q.cl, 0); total += v;
      html += `<span class="t-etq" style="left:${(g.x + g.l / 2).toFixed(1)}px;top:${y + res.h + 2}px;${v ? '' : 'opacity:.4'}">${v ? Verse.cl(v).replace(/\s?cl/, '') : '0'}</span>`; });
    y += res.h + 44; });
  abc.style.height = y - 14 + 'px'; abc.innerHTML = html; rendus.forEach(({ c }) => abc.appendChild(c));
  document.getElementById('abc-total').textContent = `L’alphabet entier tient ${Verse.cl(total)}, soit ${String(Math.round((total / 12.5) * 10) / 10).replace('.', ',')}${NB}verres.`;
});
</script></body>
