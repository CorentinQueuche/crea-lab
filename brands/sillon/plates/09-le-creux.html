<body><div class="plate" id="p"><canvas id="c"></canvas><div class="pl-pied t-etq" style="z-index:9;color:#0E1638"><span>09 · Le creux, de près</span><span></span><span>2026</span></div></div>
<script>
const A = Marque, K = A.CONSTRUCTION, S = 14, d = new Path2D(A.letterPath('LL'));
window.pret = Verse.pret().then(() => Verse.formes(document.getElementById('c'), { l: 1400, h: 1000, ech: 100 * S, ombre: false, jus: 'maceration', p: A.NIVEAU, mini: 0.0005,
  tracer: (c) => { c.translate(700, 500); c.scale(S, S); c.translate(-(K.creux.x + K.creux.l / 2), -45); c.fill(d); } }));
</script></body>
